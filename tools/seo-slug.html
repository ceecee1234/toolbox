  let separator = '-';
  let history = [];

  try { history = JSON.parse(localStorage.getItem('slug_hist_v1') || '[]'); } catch {}

  function toSlug(text) {
    let result = '';
    for (const ch of text) {
      const py = PY[ch];
      if (py) {
        result += ' ' + py + ' ';
      } else if (/[a-zA-Z]/.test(ch)) {
        result += ch;
      } else if (/[0-9]/.test(ch)) {
        if (document.getElementById('keepNums').checked) {
          result += ch;
        }
      } else if (ch === ' ' || ch === '-' || ch === '_') {
        result += ' ';
      } else {
        result += ' ';
      }
    }
    if (document.getElementById('forceLower').checked) {
      result = result.toLowerCase();
    }
    result = result.replace(/[^\w\s-]/g, ' ').trim();
    result = result.replace(/[\s_-]+/g, separator);
    result = result.replace(new RegExp('^[\\' + separator + ']+|[\\' + separator + ']+$', 'g'), '');
    return result;
  }

  function generateSlug() {
    const title = document.getElementById('titleInput').value.trim();
    const slug = toSlug(title);
    const output = document.getElementById('slugOutput');
    const urlPreview = document.getElementById('urlPreview');

    if (slug) {
      output.innerHTML = slug;
      document.getElementById('urlSlug').textContent = slug;
      urlPreview.style.display = 'block';
    } else {
      output.innerHTML = '<span class="slug-empty">输入标题后自动生成…</span>';
      urlPreview.style.display = 'none';
    }
  }

  window.copySlug = function() {
    const slug = document.getElementById('slugOutput').textContent.trim();
    if (!slug || slug === '输入标题后自动生成…') {
      toast('请先输入标题');
      return;
    }
    navigator.clipboard.writeText(slug).then(() => {
      toast('Slug 已复制');
      addHistory(document.getElementById('titleInput').value.trim(), slug);
    }).catch(() => toast('复制失败'));
  };

  function addHistory(origin, slug) {
    if (!slug || !origin) return;
    history = history.filter(h => h.slug !== slug);
    history.unshift({ origin, slug, time: Date.now() });
    if (history.length > 20) history = history.slice(0, 20);
    localStorage.setItem('slug_hist_v1', JSON.stringify(history));
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    if (history.length === 0) {
      list.innerHTML = '<div class="history-empty">暂无历史记录</div>';
      return;
    }
    list.innerHTML = history.map((h, i) => '<div class="history-item"><span class="history-origin" title="' + escAttr(h.origin) + '">' + escHtml(h.origin) + '</span><span class="history-slug" title="' + escAttr(h.slug) + '">' + escHtml(h.slug) + '</span><button class="history-copy-btn" onclick="copyHistory(' + i + ')">复制</button></div>').join('');
  }

  window.copyHistory = function(i) {
    const slug = history[i].slug;
    navigator.clipboard.writeText(slug).then(() => toast('已复制')).catch(() => toast('复制失败'));
  };

  function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s) { return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  document.getElementById('titleInput').addEventListener('input', generateSlug);
  document.getElementById('forceLower').addEventListener('change', generateSlug);
  document.getElementById('keepNums').addEventListener('change', generateSlug);

  document.querySelectorAll('.seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      separator = btn.dataset.sep;
      generateSlug();
    });
  });

  document.querySelectorAll('.example-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.getElementById('titleInput').value = chip.dataset.text;
      generateSlug();
    });
  });

  document.getElementById('copyBtn').addEventListener('click', copySlug);
  document.getElementById('clearHistoryBtn').addEventListener('click', () => {
    history = [];
    localStorage.removeItem('slug_hist_v1');
    renderHistory();
    toast('已清空历史');
  });

  document.getElementById('lowerOpt').addEventListener('click', () => {
    const cb = document.getElementById('forceLower');
    cb.checked = !cb.checked;
    document.getElementById('lowerOpt').classList.toggle('active', cb.checked);
    generateSlug();
  });

  document.getElementById('numOpt').addEventListener('click', () => {
    const cb = document.getElementById('keepNums');
    cb.checked = !cb.checked;
    document.getElementById('numOpt').classList.toggle('active', cb.checked);
    generateSlug();
  });

  renderHistory();
})();
