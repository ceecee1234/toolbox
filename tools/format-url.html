<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL 网址实时编解码与参数解析器 - 全能工具箱 V2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aurora-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            background-size: 200% 200%;
            animation: aurora-animation 15s ease infinite;
        }
        @keyframes aurora-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <header class="aurora-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <a href="../index.html" class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl transition-all duration-200 flex items-center justify-center backdrop-blur-md border border-white/10" title="返回主页">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2">
                        URL 网址编解码器
                    </h1>
                    <p class="text-white/80 text-sm mt-0.5">支持标准的 URL 实时组件编解码，并内置高维度的 Query 参数可视化提取表格</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="favBtn" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-2 backdrop-blur-md border border-white/10">
                    <i class="fa-regular fa-star" id="favIcon"></i>
                    <span id="favText">加入收藏</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 mb-6">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-700 mb-2 flex items-center justify-between">
                        <span>输入原始文本 或 待解析的 URL 链接</span>
                        <button onclick="clearAll('urlInput')" class="text-xs text-slate-400 hover:text-slate-600"><i class="fa-solid fa-trash-can mr-1"></i>清空</button>
                    </label>
                    <textarea id="urlInput" class="w-full h-44 p-4 rounded-xl border border-slate-200 font-mono text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all outline-none resize-none" placeholder="在此输入需要编码的原始字符，或者需要解码/提取参数的完整 URL 地址..."></textarea>
                </div>
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-700 mb-2 flex items-center justify-between">
                        <span>转换/转换输出结果</span>
                        <button onclick="copyOutput()" class="text-xs text-violet-600 hover:text-violet-800 font-semibold"><i class="fa-solid fa-copy mr-1"></i>复制结果</button>
                    </label>
                    <textarea id="urlOutput" class="w-full h-44 p-4 rounded-xl border border-slate-200 font-mono text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all outline-none resize-none text-slate-600" placeholder="处理后的结果展示区..."></textarea>
                </div>
            </div>

            <div class="mt-6 flex flex-wrap justify-between items-center gap-3 border-t border-slate-100 pt-6">
                <div class="flex items-center gap-4 text-xs text-slate-500">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="radio" name="encMode" id="modeStandard" checked class="text-violet-500 focus:ring-violet-500">
                        <span>标准编解码 (encodeURI)</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer" title="会将斜杠、问号等特殊符号一并编码，适合作为参数拼接时使用">
                        <input type="radio" name="encMode" id="modeComponent" class="text-violet-500 focus:ring-violet-500">
                        <span>全组件级别 (encodeURIComponent)</span>
                    </label>
                </div>
                <div class="flex gap-3">
                    <button onclick="processUrl('decode')" class="px-5 py-2.5 border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-xl transition-colors">
                        <i class="fa-solid fa-link-slash mr-2 text-slate-500"></i>URL 解码 (Decode)
                    </button>
                    <button onclick="processUrl('encode')" class="px-6 py-2.5 aurora-bg text-white text-sm font-semibold rounded-xl shadow-md shadow-violet-500/10 hover:opacity-95 transition-all transform active:scale-98">
                        <i class="fa-solid fa-link mr-2"></i>URL 编码 (Encode)
                    </button>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-semibold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-table-list text-pink-500"></i> URL Query 参数可视化解析表格
                </h3>
                <button onclick="analyzeUrlParams()" class="px-3 py-1.5 bg-violet-50 border border-violet-100 text-violet-700 hover:bg-violet-100 text-xs font-semibold rounded-lg transition-colors">
                    <i class="fa-solid fa-magnifying-glass-chart mr-1"></i>一键从上方输入框抓取解析
                </button>
            </div>
            
            <div class="overflow-x-auto border border-slate-150 rounded-xl bg-slate-50/30">
                <table class="min-w-full divide-y divide-slate-200 text-sm text-left">
                    <thead class="bg-slate-50 text-slate-600 font-semibold text-xs uppercase tracking-wider">
                        <tr>
                            <th class="px-6 py-3 w-1/4">参数名 (Key)</th>
                            <th class="px-6 py-3 w-3/4">参数值 (Value)</th>
                        </tr>
                    </thead>
                    <tbody id="paramTableBody" class="divide-y divide-slate-150 bg-white text-slate-600">
                        <tr>
                            <td colspan="2" class="px-6 py-8 text-center text-slate-400 font-normal">暂无解析数据，请在上方粘贴带问号参数的 URL 链接并点击上方一键抓取</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // URL 编码与解码核心原生逻辑
        function processUrl(action) {
            const input = document.getElementById('urlInput').value.trim();
            const outputArea = document.getElementById('urlOutput');
            const isComponent = document.getElementById('modeComponent').checked;

            if (!input) return alert('请输入需要处理的网址或文本字符串！');

            try {
                if (action === 'encode') {
                    outputArea.value = isComponent ? encodeURIComponent(input) : encodeURI(input);
                } else {
                    outputArea.value = isComponent ? decodeURIComponent(input) : decodeURI(input);
                }
            } catch (e) {
                alert('URL 处理发生异常，请检查输入的字符串编码格式是否标准！');
                outputArea.value = '';
            }
        }

        // Query 参数智能截取与表格化渲染核心逻辑
        function analyzeUrlParams() {
            const input = document.getElementById('urlInput').value.trim();
            const tableBody = document.getElementById('paramTableBody');
            
            if (!input) return alert('请先在输入框中填入包含参数的完整 URL 地址！');

            try {
                // 自动过滤并定位问号后的参数字符串
                let queryString = '';
                if (input.includes('?')) {
                    queryString = input.split('?')[1].split('#')[0];
                } else if (input.includes('=')) {
                    queryString = input; // 如果用户直接粘贴了 a=1&b=2 这样的片段也兼容支持
                }

                if (!queryString) {
                    tableBody.innerHTML = `<tr><td colspan="2" class="px-6 py-6 text-center text-amber-500 font-medium"><i class="fa-solid fa-circle-exclamation mr-1.5"></i>未能检测到该链接中的任何 URL 传参（Query Parameters）</td></tr>`;
                    return;
                }

                const urlParams = new URLSearchParams(queryString);
                let htmlRows = '';
                let paramCount = 0;

                urlParams.forEach((value, key) => {
                    paramCount++;
                    htmlRows += `
                        <tr class="hover:bg-slate-50/80 transition-colors">
                            <td class="px-6 py-3.5 font-mono text-xs text-slate-800 font-semibold break-all">${escapeHtml(key)}</td>
                            <td class="px-6 py-3.5 font-mono text-xs text-slate-600 break-all bg-slate-50/20">${escapeHtml(value)}</td>
                        </tr>
                    `;
                });

                if (paramCount === 0) {
                    throw new Error();
                }
                tableBody.innerHTML = htmlRows;

            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="2" class="px-6 py-6 text-center text-rose-500 font-medium"><i class="fa-solid fa-triangle-exclamation mr-1.5"></i>参数解析失败，请确保链接参数格式类似 key=value&key2=value2</td></tr>`;
            }
        }

        // HTML 字符实体防御逃逸过滤安全函数
        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
            });
        }

        function clearAll(id) {
            document.getElementById(id).value = '';
            if(id === 'urlInput') {
                document.getElementById('paramTableBody').innerHTML = `<tr><td colspan="2" class="px-6 py-8 text-center text-slate-400 font-normal">暂无解析数据，请在上方粘贴带问号参数的 URL 链接并点击上方一键抓取</td></tr>`;
            }
        }

        function copyOutput() {
            const text = document.getElementById('urlOutput').value;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => alert('处理后的 URL 结果已复制成功！'));
        }

        // 统一框架页面载入钩子
        document.addEventListener('DOMContentLoaded', () => {
            if (window.parent && window.parent.integrateToolPage) {
                window.parent.integrateToolPage('format-url');
            }
        });
    </script>
</body>
</html>
