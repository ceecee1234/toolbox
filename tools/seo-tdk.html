<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>网页 TDK 标签提取 - Dev Toolbox</title>
<meta name="description" content="在线 TDK 提取工具，粘贴 HTML 源码即可解析 Title、Description、Keywords 和 Open Graph 标签，自动检测 SEO 字数合规性。">
<link rel="icon" href="../favicon.ico">
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #22263a;
    --border: #2e3347;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
    --success: #22c55e;
    --success-bg: rgba(34,197,94,0.15);
    --success-text: #86efac;
    --warning: #f59e0b;
    --warning-bg: rgba(245,158,11,0.15);
    --warning-text: #fde68a;
    --error: #ef4444;
    --error-bg: rgba(239,68,68,0.15);
    --error-text: #fecaca;
    --og-key: #a78bfa;
  }
  [data-theme="light"] {
    --bg: #f8fafc;
    --bg2: #ffffff;
    --bg3: #f1f5f9;
    --border: #e2e8f0;
    --text: #1e293b;
    --text2: #475569;
    --text3: #94a3b8;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
    --success-bg: rgba(34,197,94,0.1);
    --success-text: #166534;
    --warning-bg: rgba(245,158,11,0.1);
    --warning-text: #92400e;
    --error-bg: rgba(239,68,68,0.1);
    --error-text: #991b1b;
    --og-key: #7c3aed;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding-bottom: 60px;
  }
  .page-header {
    position: relative;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    padding: 28px 24px 20px;
  }
  .page-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 80% at 20% 50%, rgba(59,130,246,0.12) 0%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 80% 30%, rgba(99,102,241,0.08) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text2);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg3);
    transition: all .2s;
    white-space: nowrap;
  }
  .back-btn:hover { color: var(--text); border-color: var(--accent); }
  .header-title { flex: 1; }
  .header-title h1 { font-size: 20px; font-weight: 700; line-height: 1.3; }
  .header-title p { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .fav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all .2s;
  }
  .fav-btn:hover { border-color: var(--accent); }
  .fav-btn.active { color: #fbbf24; border-color: #fbbf24; background: rgba(251,191,36,0.1); }
  .theme-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all .2s;
  }
  .theme-btn:hover { border-color: var(--accent); color: var(--accent); }

  .main { max-width: 900px; margin: 0 auto; padding: 20px 16px; }

  .input-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
  }
  .card-title { font-size: 13px; font-weight: 600; color: var(--text2); }
  textarea {
    width: 100%;
    min-height: 140px;
    background: var(--bg2);
    color: var(--text);
    border: none;
    outline: none;
    resize: vertical;
    padding: 14px 16px;
    font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    font-size: 13px;
    line-height: 1.6;
  }
  textarea::placeholder { color: var(--text3); }
  .btn-row { display: flex; gap: 8px; padding: 0 16px 14px; flex-wrap: wrap; }
  .btn {
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg3);
    color: var(--text);
    cursor: pointer;
    transition: all .2s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: #fff; }

  .tdk-list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 20px; }

  .tdk-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .tdk-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg3);
    gap: 10px;
    flex-wrap: wrap;
  }
  .tdk-name { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .tdk-name .icon { font-size: 16px; }
  .char-badge {
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
  }
  .char-ok { background: var(--success-bg); color: var(--success-text); }
  .char-warn { background: var(--warning-bg); color: var(--warning-text); }
  .char-bad { background: var(--error-bg); color: var(--error-text); }
  .char-na { background: var(--bg3); color: var(--text3); }
  .tdk-body {
    padding: 14px 16px;
    font-size: 14px;
    word-break: break-word;
    line-height: 1.7;
  }
  .tdk-empty { color: var(--text3); font-style: italic; }
  .tdk-actions {
    padding: 10px 16px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
    background: var(--bg3);
  }
  .copy-btn {
    padding: 5px 14px;
    font-size: 12px;
    font-weight: 600;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    color: var(--text2);
    transition: all .2s;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
  .seo-tip { font-size: 12px; color: var(--text3); }

  .og-section {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .og-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    background: var(--bg3);
  }
  .og-grid {
    padding: 16px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  .og-item {
    background: var(--bg3);
    border-radius: 8px;
    padding: 12px 14px;
  }
  .og-key {
    font-size: 11px;
    font-family: 'JetBrains Mono', 'Fira Code', monospace;
    color: var(--og-key);
    margin-bottom: 4px;
    font-weight: 600;
  }
  .og-val {
    font-size: 13px;
    word-break: break-word;
    color: var(--text);
  }
  .og-empty {
    padding: 24px;
    text-align: center;
    color: var(--text3);
    font-size: 14px;
  }

  .preview-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
  }
  .preview-head {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    font-weight: 700;
    background: var(--bg3);
  }
  .preview-body { padding: 20px; }
  .serp-preview {
    background: #fff;
    border: 1px solid #dfe1e5;
    border-radius: 12px;
    padding: 16px 20px;
    max-width: 600px;
    font-family: arial, sans-serif;
  }
  [data-theme="dark"] .serp-preview { background: #202124; border-color: #3c4043; }
  .serp-url {
    font-size: 14px;
    color: #202124;
    margin-bottom: 3px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  [data-theme="dark"] .serp-url { color: #bdc1c6; }
  .serp-title {
    font-size: 20px;
    color: #1a0dab;
    margin-bottom: 4px;
    line-height: 1.3;
    cursor: pointer;
  }
  [data-theme="dark"] .serp-title { color: #8ab4f8; }
  .serp-title:hover { text-decoration: underline; }
  .serp-desc {
    font-size: 14px;
    color: #4d5156;
    line-height: 1.6;
  }
  [data-theme="dark"] .serp-desc { color: #bdc1c6; }
  .serp-date { color: #70757a; margin-right: 8px; }
  [data-theme="dark"] .serp-date { color: #9aa0a6; }

  .empty-state {
    padding: 48px 20px;
    text-align: center;
    color: var(--text3);
  }
  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: .5; }

  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13px;
    color: var(--text);
    box-shadow: var(--shadow);
    transform: translateY(80px);
    opacity: 0;
    transition: all .3s;
    z-index: 9999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 500px) {
    .og-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header class="page-header">
  <div class="header-inner">
    <a href="../index.html" class="back-btn">← 返回首页</a>
    <div class="header-title">
      <h1>网页 TDK 标签提取</h1>
      <p>标题 / 描述 / 关键词 / OG 标签解析 · SEO 字数检测</p>
    </div>
    <button class="fav-btn" id="favBtn" title="收藏此工具">☆</button>
    <button class="theme-btn" id="themeBtn" title="切换主题">☀️</button>
  </div>
</header>

<div class="main">
  <div class="input-card">
    <div class="card-header">
      <span class="card-title">粘贴 HTML 源码</span>
    </div>
    <textarea id="htmlInput" placeholder="粘贴网页 HTML 源码，自动提取 TDK 信息…" spellcheck="false"></textarea>
    <div class="btn-row">
      <button class="btn" id="clearBtn">清空</button>
      <button class="btn btn-primary" id="parseBtn">解析 TDK</button>
    </div>
  </div>

  <div id="results"></div>
</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  const savedTheme = localStorage.getItem('toolbox_theme') || 'dark';
  document.documentElement.dataset.theme = savedTheme;
  const themeBtn = document.getElementById('themeBtn');
  themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  themeBtn.addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    localStorage.setItem('toolbox_theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  });

  const FAV_KEY = 'toolbox_favorites_v2';
  const TOOL_ID = 'seo-tdk';
  function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; } }
  function setFavs(arr) { localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }
  const favBtn = document.getElementById('favBtn');
  const favs = getFavs();
  if (favs.includes(TOOL_ID)) { favBtn.classList.add('active'); favBtn.textContent = '★'; }
  favBtn.addEventListener('click', () => {
    const arr = getFavs();
    if (arr.includes(TOOL_ID)) {
      setFavs(arr.filter(x => x !== TOOL_ID));
      favBtn.classList.remove('active');
      favBtn.textContent = '☆';
    } else {
      setFavs([TOOL_ID, ...arr.filter(x => x !== TOOL_ID)]);
      favBtn.classList.add('active');
      favBtn.textContent = '★';
    }
  });

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function getCharStatus(cnt, type) {
    if (type === 'title') {
      if (cnt === 0) return { cls: 'char-na', tip: '未设置' };
      if (cnt < 10) return { cls: 'char-bad', tip: '过短，建议 10–60 字' };
      if (cnt > 60) return { cls: 'char-warn', tip: '过长，可能被截断' };
      return { cls: 'char-ok', tip: 'SEO 友好' };
    }
    if (type === 'desc') {
      if (cnt === 0) return { cls: 'char-na', tip: '未设置' };
      if (cnt < 50) return { cls: 'char-warn', tip: '偏短，建议 50–160 字' };
      if (cnt > 160) return { cls: 'char-bad', tip: '过长，超过 160 字将被截断' };
      return { cls: 'char-ok', tip: 'SEO 友好' };
    }
    if (type === 'keywords') {
      if (cnt === 0) return { cls: 'char-na', tip: '未设置' };
      if (cnt < 3) return { cls: 'char-warn', tip: '关键词偏少，建议 3–10 个' };
      if (cnt > 10) return { cls: 'char-warn', tip: '关键词偏多，建议 3–10 个' };
      return { cls: 'char-ok', tip: 'SEO 友好' };
    }
    return { cls: 'char-na', tip: '' };
  }

  function parse() {
    const html = document.getElementById('htmlInput').value.trim();
    const results = document.getElementById('results');

    if (!html) {
      results.innerHTML = '<div class="empty-state"><div class="empty-icon">📄</div><div>粘贴 HTML 源码后点击解析</div></div>';
      return;
    }

    const doc = new DOMParser().parseFromString(html, 'text/html');
    const titleEl = doc.querySelector('title');
    const descEl = doc.querySelector('meta[name="description" i], meta[property="description" i]');
    const kwEl = doc.querySelector('meta[name="keywords" i]');

    const title = titleEl ? titleEl.textContent.trim() : '';
    const desc = descEl ? (descEl.getAttribute('content') || '').trim() : '';
    const keywords = kwEl ? (kwEl.getAttribute('content') || '').trim() : '';

    const tStatus = getCharStatus(title.length, 'title');
    const dStatus = getCharStatus(desc.length, 'desc');
    const kwCount = keywords ? keywords.split(/[,，、;；\s]+/).filter(x => x.trim()).length : 0;
    const kStatus = getCharStatus(kwCount, 'keywords');

    let html_out = '<div class="tdk-list">';

    html_out += '<div class="tdk-card"><div class="tdk-head"><div class="tdk-name"><span class="icon">📌</span> Title 标题</div><span class="char-badge ' + tStatus.cls + '">' + (title ? title.length + ' 字' : '0 字') + '</span></div>';
    html_out += '<div class="tdk-body">' + (title ? escHtml(title) : '<span class="tdk-empty">未设置</span>') + '</div>';
    html_out += '<div class="tdk-actions"><button class="copy-btn" onclick="copyText(this)" data-val="' + escHtml(title).replace(/"/g, '&quot;') + '">📋 复制</button><span class="seo-tip">' + tStatus.tip + '</span></div></div>';

    html_out += '<div class="tdk-card"><div class="tdk-head"><div class="tdk-name"><span class="icon">📝</span> Description 描述</div><span class="char-badge ' + dStatus.cls + '">' + (desc ? desc.length + ' 字' : '0 字') + '</span></div>';
    html_out += '<div class="tdk-body">' + (desc ? escHtml(desc) : '<span class="tdk-empty">未设置</span>') + '</div>';
    html_out += '<div class="tdk-actions"><button class="copy-btn" onclick="copyText(this)" data-val="' + escHtml(desc).replace(/"/g, '&quot;') + '">📋 复制</button><span class="seo-tip">' + dStatus.tip + '</span></div></div>';

    html_out += '<div class="tdk-card"><div class="tdk-head"><div class="tdk-name"><span class="icon">🔑</span> Keywords 关键词</div><span class="char-badge ' + kStatus.cls + '">' + kwCount + ' 个</span></div>';
    html_out += '<div class="tdk-body">' + (keywords ? escHtml(keywords) : '<span class="tdk-empty">未设置</span>') + '</div>';
    html_out += '<div class="tdk-actions"><button class="copy-btn" onclick="copyText(this)" data-val="' + escHtml(keywords).replace(/"/g, '&quot;') + '">📋 复制</button><span class="seo-tip">' + kStatus.tip + '</span></div></div>';

    html_out += '</div>';

    const ogTags = doc.querySelectorAll('meta[property^="og:"], meta[name^="og:"]');
    const twitterTags = doc.querySelectorAll('meta[name^="twitter:"], meta[property^="twitter:"]');
    const allSocial = [...ogTags, ...twitterTags];
    const socialData = {};
    allSocial.forEach(el => {
      let key = el.getAttribute('property') || el.getAttribute('name') || '';
      const val = el.getAttribute('content') || '';
      if (key && val) socialData[key] = val;
    });

    if (Object.keys(socialData).length > 0) {
      html_out += '<div class="og-section"><div class="og-head">Open Graph & Twitter Card 标签</div><div class="og-grid">';
      Object.entries(socialData).forEach(([k, v]) => {
        html_out += '<div class="og-item"><div class="og-key">' + escHtml(k) + '</div><div class="og-val">' + escHtml(v) + '</div></div>';
      });
      html_out += '</div></div>';
    }

    if (title) {
      const today = new Date();
      const dateStr = today.getFullYear() + '年' + (today.getMonth() + 1) + '月' + today.getDate() + '日';
      html_out += '<div class="preview-card"><div class="preview-head">Google 搜索结果预览</div><div class="preview-body"><div class="serp-preview">';
      html_out += '<div class="serp-url">https://example.com/page-url</div>';
      html_out += '<div class="serp-title">' + escHtml(title) + '</div>';
      html_out += '<div class="serp-desc"><span class="serp-date">' + dateStr + '</span>' + escHtml(desc || '该页面暂无描述信息…') + '</div>';
      html_out += '</div></div></div>';
    }

    results.innerHTML = html_out;
  }

  window.copyText = function(btn) {
    const val = btn.dataset.val;
    if (!val) { toast('无内容可复制'); return; }
    navigator.clipboard.writeText(val).then(() => toast('已复制')).catch(() => toast('复制失败'));
  };

  document.getElementById('parseBtn').addEventListener('click', parse);
  document.getElementById('clearBtn').addEventListener('click', () => {
    document.getElementById('htmlInput').value = '';
    document.getElementById('results').innerHTML = '<div class="empty-state"><div class="empty-icon">📄</div><div>粘贴 HTML 源码后点击解析</div></div>';
  });

  document.getElementById('htmlInput').addEventListener('input', () => {
    clearTimeout(window.parseTimer);
    window.parseTimer = setTimeout(parse, 500);
  });

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  document.getElementById('results').innerHTML = '<div class="empty-state"><div class="empty-icon">📄</div><div>粘贴 HTML 源码后点击解析</div></div>';
})();
</script>
</body>
</html>
