<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自媒体违禁词与敏感词雷达检测器 - 全能工具箱 V2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aurora-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            background-size: 200% 200%;
            animation: aurora-animation 15s ease infinite;
        }
        @keyframes aurora-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 动态高亮特效 */
        .censor-danger {
            background-color: rgba(239, 68, 68, 0.25);
            border-bottom: 2px dashed #ef4444;
            color: #dc2626;
            font-weight: bold;
            padding: 0 2px;
            border-radius: 3px;
        }
        .censor-warning {
            background-color: rgba(245, 158, 11, 0.25);
            border-bottom: 2px dashed #f59e0b;
            color: #d97706;
            font-weight: bold;
            padding: 0 2px;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <header class="aurora-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <a href="../index.html" class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl transition-all duration-200 flex items-center justify-center backdrop-blur-md border border-white/10" title="返回主页">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2">
                        自媒体文案违禁词雷达
                    </h1>
                    <p class="text-white/80 text-sm mt-0.5">内置新广告法及主流社媒平台严苛规避词库，本地实时扫描，绝不泄露商业文案隐私</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="favBtn" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-2 backdrop-blur-md border border-white/10">
                    <i class="fa-regular fa-star" id="favIcon"></i>
                    <span id="favText">加入收藏</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <div class="lg:col-span-2 space-y-4">
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col">
                    <div class="flex justify-between items-center mb-2">
                        <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                            <i class="fa-solid fa-file-pen text-rose-500"></i> 粘贴你的营销文案/脚本/主图文案
                        </label>
                        <div class="flex gap-4 text-xs">
                            <button onclick="loadDemo()" class="text-violet-600 hover:text-violet-800 font-semibold">填入测试Demo</button>
                            <button onclick="clearAll()" class="text-slate-400 hover:text-slate-600">清空</button>
                        </div>
                    </div>
                    <textarea id="censorInput" oninput="scanText()" class="w-full h-56 p-4 rounded-xl border border-slate-200 text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-rose-500/20 focus:border-rose-500 transition-all outline-none resize-none" placeholder="在此粘贴你需要检查的文本，右侧将实时亮灯提示潜在风险..."></textarea>
                    
                    <div class="mt-4">
                        <label class="text-sm font-semibold text-slate-700 mb-2 block flex items-center gap-2">
                            <i class="fa-solid fa-eye text-violet-500"></i> 违规风险实时透视镜
                        </label>
                        <div id="highlightViewer" class="w-full min-h-36 p-4 rounded-xl border border-dashed border-slate-200 bg-slate-50/50 text-sm text-slate-600 whitespace-pre-wrap break-all leading-relaxed">等待输入文本...</div>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col justify-between">
                <div>
                    <h3 class="text-sm font-bold text-slate-800 flex items-center justify-between mb-4">
                        <span><i class="fa-solid fa-shield-halved text-emerald-500 mr-1.5"></i> 诊断报告与规避建议</span>
                        <span id="badgeCounter" class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded-full text-2xs font-bold">0 风险</span>
                    </h3>

                    <div class="grid grid-cols-2 gap-2 mb-4 text-center">
                        <div class="bg-rose-50 border border-rose-100 p-2 rounded-xl">
                            <span class="block text-2xs text-slate-400 font-medium">严禁词次数</span>
                            <span id="dangerCount" class="text-lg font-mono font-bold text-rose-600">0</span>
                        </div>
                        <div class="bg-amber-50 border border-amber-100 p-2 rounded-xl">
                            <span class="block text-2xs text-slate-400 font-medium">涉嫌违规次</span>
                            <span id="warningCount" class="text-lg font-mono font-bold text-amber-600">0</span>
                        </div>
                    </div>

                    <div id="reportList" class="space-y-2 max-h-80 overflow-y-auto pr-1 text-xs">
                        <div class="text-center py-8 text-slate-400">
                            <i class="fa-solid fa-circle-check text-2xl text-emerald-400 block mb-1"></i>
                            暂未检出任何合规安全风险
                        </div>
                    </div>
                </div>

                <button onclick="oneClickReplace()" class="w-full mt-4 py-2.5 bg-slate-800 text-white hover:bg-slate-900 text-xs font-semibold rounded-xl shadow-md transition-all flex items-center justify-center gap-1.5">
                    <i class="fa-solid fa-wand-magic"></i>一键脱敏（将违禁词替换为 *）
                </button>
            </div>

        </div>
    </main>

    <script>
        // 1. 本地硬核违禁词数据库（按严重层级分类）
        const DICT_DANGER = [
            '第一', '顶级', '国家格', '最先进', '首个', '100%', '万能', '特效', 
            '神效', '全网第一', '绝无仅有', '消炎', '抗癌', '备孕必备', '根治'
        ];
        
        const DICT_WARNING = [
            '绝对', '全网最', '极其', '精准', '爆款', '秒杀', '懒人必备', 
            '平替', '逆天', '暴富', '100%赚钱', '躺赚', '唯一'
        ];

        function scanText() {
            const text = document.getElementById('censorInput').value;
            const viewer = document.getElementById('highlightViewer');
            const report = document.getElementById('reportList');
            
            if(!text.trim()) {
                viewer.innerText = '等待输入文本...';
                document.getElementById('badgeCounter').innerText = '0 风险';
                document.getElementById('dangerCount').innerText = '0';
                document.getElementById('warningCount').innerText = '0';
                report.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-circle-check text-2xl text-emerald-400 block mb-1"></i>暂未检出任何合规安全风险</div>`;
                return;
            }

            let html = escapeHtml(text);
            let dangerHits = [];
            let warningHits = [];

            // 扫描严禁词
            DICT_DANGER.forEach(word => {
                if(text.includes(word)) {
                    dangerHits.push(word);
                    const regex = new RegExp(escapeRegExp(word), 'g');
                    html = html.replace(regex, `<span class="censor-danger">${word}</span>`);
                }
            });

            // 扫描涉嫌词
            DICT_WARNING.forEach(word => {
                if(text.includes(word)) {
                    warningHits.push(word);
                    const regex = new RegExp(escapeRegExp(word), 'g');
                    html = html.replace(regex, `<span class="censor-warning">${word}</span>`);
                }
            });

            // 2. 渲染左侧实时透视镜
            viewer.innerHTML = html;

            // 3. 联动右侧统计指示灯
            const totalHits = dangerHits.length + warningHits.length;
            document.getElementById('badgeCounter').innerText = `${totalHits} 个潜在风险`;
            document.getElementById('dangerCount').innerText = dangerHits.length;
            document.getElementById('warningCount').innerText = warningHits.length;

            // 4. 组装右侧诊断明细 HTML
            if(totalHits === 0) {
                report.innerHTML = `<div class="text-center py-8 text-slate-400"><i class="fa-solid fa-circle-check text-2xl text-emerald-400 block mb-1"></i>文案非常安全，未踩雷！</div>`;
            } else {
                let reportHtml = '';
                dangerHits.forEach(w => {
                    reportHtml += `
                        <div class="p-2.5 bg-rose-50/60 border border-rose-100 rounded-lg flex flex-col gap-0.5">
                            <div class="flex justify-between font-bold text-rose-700"><span>🚨 严禁词: 【${w}】</span><span class="text-2xs font-normal text-rose-400">广告法明令禁止</span></div>
                            <div class="text-slate-500 scale-95 origin-left">建议：直接删除此词，或者改为“行业前列”、“表现优异”等中性描述。</div>
                        </div>`;
                });
                warningHits.forEach(w => {
                    reportHtml += `
                        <div class="p-2.5 bg-amber-50/60 border border-amber-100 rounded-lg flex flex-col gap-0.5">
                            <div class="flex justify-between font-bold text-amber-700"><span>⚠️ 涉嫌词: 【${w}】</span><span class="text-2xs font-normal text-amber-400">社警惕限流</span></div>
                            <div class="text-slate-500 scale-95 origin-left">建议：容易触发机器限流拦截，建议更换为更温和的修辞。</div>
                        </div>`;
                });
                report.innerHTML = reportHtml;
            }
        }

        // 一键自动脱敏打码
        function oneClickReplace() {
            let txt = document.getElementById('censorInput').value;
            if(!txt.trim()) return alert('当前没有待处理的文案内容！');

            DICT_DANGER.forEach(w => { txt = txt.split(w).join('***'); });
            DICT_WARNING.forEach(w => { txt = txt.split(w).join('**'); });

            document.getElementById('censorInput').value = txt;
            scanText();
            alert('一键脱敏完成！已将高危词打码。');
        }

        function loadDemo() {
            document.getElementById('censorInput').value = `全能工具箱爆款文案测试：\n本产品是全网第一的万能神器，100%根治你的文案焦虑！\n精准平替各种逆天大牌，懒人必备，带你实现暴富，绝对靠谱！`;
            scanText();
        }

        function clearAll() {
            document.getElementById('censorInput').value = '';
            scanText();
        }

        function escapeRegExp(string) {
            return string.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        }

        function escapeHtml(string) {
            return String(string).replace(/[&<>"']/g, function (s) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s];
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (window.parent && window.parent.integrateToolPage) {
                window.parent.integrateToolPage('text-censor');
            }
        });
    </script>
</body>
</html>
