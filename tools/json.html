<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON格式化工具 - 在线美化压缩校验 | 全能工具箱</title>
    <meta name="description" content="免费在线JSON格式化工具，支持JSON美化、压缩、校验、转义，一键处理JSON数据，程序员必备工具。">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
    <style>
        :root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--text2:#64748b;--primary:#4F46E5;--success:#10B981;--error:#EF4444;--border:#e2e8f0;--radius:12px}
        .dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--border:#334155}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
        .header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px}
        .header-inner{max-width:1000px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:18px;font-weight:700;text-decoration:none;color:var(--text)}
        .main{max-width:1000px;margin:0 auto;padding:20px}
        .breadcrumb{display:flex;gap:8px;font-size:14px;color:var(--text2);margin-bottom:20px}
        .breadcrumb a{color:var(--primary);text-decoration:none}
        .tool-header{margin-bottom:20px}
        .tool-header h1{font-size:26px;display:flex;align-items:center;gap:10px}
        .ad-slot{margin:20px 0;padding:15px;background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);text-align:center;color:var(--text2)}
        .tool-area{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
        @media(max-width:768px){.tool-area{grid-template-columns:1fr}}
        .panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
        .panel-header{padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border);font-weight:600;font-size:14px}
        .panel textarea{width:100%;height:350px;padding:16px;border:none;background:var(--card);color:var(--text);font-family:monospace;font-size:14px;resize:vertical;outline:none}
        .btn-group{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:20px}
        .btn{padding:12px 24px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(79,70,229,0.3)}
        .btn-secondary{background:var(--border);color:var(--text)}
        .btn-secondary:hover{background:var(--text2);color:white}
        .btn-success{background:var(--success);color:white}
        .status{padding:10px 16px;border-radius:8px;font-size:14px;margin-bottom:20px;display:none}
        .status.show{display:block}
        .status.success{background:rgba(16,185,129,0.1);color:var(--success)}
        .status.error{background:rgba(239,68,68,0.1);color:var(--error)}
        .footer{margin-top:60px;padding:30px;text-align:center;border-top:1px solid var(--border);color:var(--text2);font-size:14px}
        .footer a{color:var(--primary)}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="../" class="logo">🛠️ 全能工具箱</a>
            <button onclick="document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')" style="background:none;border:none;font-size:20px;cursor:pointer">🌓</button>
        </div>
    </header>

    <main class="main">
        <nav class="breadcrumb">
            <a href="../">首页</a><span>›</span>
            <a href="../#dev">开发工具</a><span>›</span>
            <span>JSON格式化</span>
        </nav>

        <div class="ad-slot">📢 广告位</div>

        <div class="tool-header">
            <h1><span>{ }</span> JSON格式化工具</h1>
        </div>

        <div class="btn-group">
            <button class="btn btn-primary" onclick="formatJSON()">✨ 格式化</button>
            <button class="btn btn-secondary" onclick="compressJSON()">📦 压缩</button>
            <button class="btn btn-secondary" onclick="validateJSON()">✅ 校验</button>
            <button class="btn btn-secondary" onclick="escapeJSON()">🔒 转义</button>
            <button class="btn btn-secondary" onclick="unescapeJSON()">🔓 反转义</button>
            <button class="btn btn-success" onclick="copyResult()">📋 复制结果</button>
            <button class="btn btn-secondary" onclick="clearAll()">🗑️ 清空</button>
        </div>

        <div id="status" class="status"></div>

        <div class="tool-area">
            <div class="panel">
                <div class="panel-header">📥 输入JSON</div>
                <textarea id="input" placeholder='{"name":"张三","age":25,"city":"北京"}'></textarea>
            </div>
            <div class="panel">
                <div class="panel-header">📤 输出结果</div>
                <textarea id="output" readonly placeholder="处理结果将显示在这里..."></textarea>
            </div>
        </div>

        <div class="ad-slot">📢 广告位</div>
    </main>

    <footer class="footer">
        <p>© 2025 全能工具箱 | <a href="../">返回首页</a></p>
    </footer>

    <script>
        function showStatus(msg, type) {
            const el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status show ' + type;
            setTimeout(() => el.className = 'status', 3000);
        }

        function formatJSON() {
            try {
                const input = document.getElementById('input').value;
                const parsed = JSON.parse(input);
                document.getElementById('output').value = JSON.stringify(parsed, null, 4);
                showStatus('✅ 格式化成功', 'success');
            } catch (e) {
                showStatus('❌ JSON格式错误: ' + e.message, 'error');
            }
        }

        function compressJSON() {
            try {
                const input = document.getElementById('input').value;
                const parsed = JSON.parse(input);
                document.getElementById('output').value = JSON.stringify(parsed);
                showStatus('✅ 压缩成功', 'success');
            } catch (e) {
                showStatus('❌ JSON格式错误: ' + e.message, 'error');
            }
        }

        function validateJSON() {
            try {
                const input = document.getElementById('input').value;
                JSON.parse(input);
                showStatus('✅ JSON格式正确', 'success');
            } catch (e) {
                showStatus('❌ JSON格式错误: ' + e.message, 'error');
            }
        }

        function escapeJSON() {
            const input = document.getElementById('input').value;
            document.getElementById('output').value = JSON.stringify(input);
            showStatus('✅ 转义成功', 'success');
        }

        function unescapeJSON() {
            try {
                const input = document.getElementById('input').value;
                document.getElementById('output').value = JSON.parse(input);
                showStatus('✅ 反转义成功', 'success');
            } catch (e) {
                showStatus('❌ 反转义失败', 'error');
            }
        }

        function copyResult() {
            const output = document.getElementById('output');
            output.select();
            document.execCommand('copy');
            showStatus('✅ 已复制到剪贴板', 'success');
        }

                function clearAll() {
            document.getElementById('input').value = '';
            document.getElementById('output').value = '';
            showStatus('✅ 已清空', 'success');
        }

        // 记录最近使用
        let recent = JSON.parse(localStorage.getItem('toolbox_recent') || '[]');
        recent = recent.filter(r => r.id !== 'json');
        recent.unshift({ id: 'json', name: 'JSON格式化', icon: '{ }', url: 'tools/json.html' });
        if (recent.length > 10) recent.pop();
        localStorage.setItem('toolbox_recent', JSON.stringify(recent));
    </script>
</body>
</html>
