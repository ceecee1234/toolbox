<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>代码/文本差异对比生成器 - 全能工具箱 V2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aurora-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            background-size: 200% 200%;
            animation: aurora-animation 15s ease infinite;
        }
        @keyframes aurora-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        /* 强制覆盖滚动条样式，保持全栈现代感 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        [data-theme="dark"] ::webkit-scrollbar-thumb { background: #334155; }
        
        /* 适配明暗主题的极端代码高亮色值变量 */
        :root {
            --diff-add-bg: rgba(74, 222, 128, 0.15);
            --diff-add-num-bg: rgba(74, 222, 128, 0.25);
            --diff-add-text: #16a34a;
            --diff-del-bg: rgba(248, 113, 113, 0.12);
            --diff-del-num-bg: rgba(248, 113, 113, 0.22);
            --diff-del-text: #dc2626;
            --hl-add-inline: rgba(34, 197, 94, 0.35);
            --hl-del-inline: rgba(239, 68, 68, 0.35);
        }
        [data-theme="dark"] {
            --diff-add-bg: rgba(16, 185, 129, 0.12);
            --diff-add-num-bg: rgba(16, 185, 129, 0.2);
            --diff-add-text: #34d399;
            --diff-del-bg: rgba(239, 68, 68, 0.12);
            --diff-del-num-bg: rgba(239, 68, 68, 0.18);
            --diff-del-text: #f87171;
            --hl-add-inline: rgba(52, 211, 153, 0.3);
            --hl-del-inline: rgba(248, 113, 113, 0.3);
        }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-900 min-h-screen font-sans text-slate-800 dark:text-slate-200 transition-colors duration-200">

    <header class="aurora-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <a href="../index.html" class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl transition-all duration-200 flex items-center justify-center backdrop-blur-md border border-white/10" title="返回主页">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2">
                        代码与文本差异对比板
                    </h1>
                    <p class="text-white/80 text-sm mt-0.5">基于精确 Myers LCS 算法，支持双栏分栏、内联字符级像素差异高亮与行号动态对齐</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="favBtn" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-2 backdrop-blur-md border border-white/10">
                    <i class="fa-regular fa-star" id="favIcon"></i>
                    <span id="favText">加入收藏</span>
                </button>
                <button id="themeBtn" class="bg-white/20 hover:bg-white/30 text-white w-10 h-10 rounded-xl transition-all duration-200 flex items-center justify-center backdrop-blur-md border border-white/10" title="切换暗黑模式">
                    <i class="fa-solid fa-moon text-lg" id="themeIcon"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
        
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200/80 dark:border-slate-700/80 flex flex-wrap items-center justify-between gap-4 mb-6">
            <div class="flex flex-wrap items-center gap-3">
                <div class="bg-slate-100 dark:bg-slate-900 p-1 rounded-xl flex gap-1 border border-slate-200/60 dark:border-slate-700/50">
                    <button onclick="switchViewMode('unified')" id="viewUnified" class="px-4 py-1.5 rounded-lg text-xs font-bold transition-all duration-150 bg-white dark:bg-slate-800 text-violet-600 dark:text-violet-400 shadow-xs">
                        <i class="fa-solid fa-bars-staggered mr-1.5"></i>统一视图
                    </button>
                    <button onclick="switchViewMode('split')" id="viewSplit" class="px-4 py-1.5 rounded-lg text-xs font-semibold transition-all duration-150 text-slate-500 hover:text-slate-700 dark:hover:text-slate-300">
                        <i class="fa-solid fa-columns mr-1.5"></i>分栏视图
                    </button>
                </div>

                <button id="optInline" onclick="toggleInlineHighlight()" class="bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-750 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-2 cursor-pointer transition-all">
                    <i class="fa-solid fa-circle-check text-emerald-500" id="inlineIcon"></i><span>内联差异高亮</span>
                </button>

                <button onclick="rotateContextLines()" class="bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-750 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-xl text-xs font-semibold flex items-center gap-1.5 cursor-pointer transition-all">
                    <i class="fa-regular fa-eye text-slate-400"></i>
                    <span>显示上下文:</span>
                    <span id="contextVal" class="font-mono font-bold text-violet-600 dark:text-violet-400 bg-violet-50 dark:bg-violet-950/40 px-1.5 py-0.5 rounded">3行</span>
                </button>
            </div>

            <div class="flex items-center gap-2 max-sm:w-full max-sm:justify-end">
                <button onclick="swapPanels()" class="bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-750 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-300 cursor-pointer transition-all"><i class="fa-solid fa-right-left mr-1.5"></i>交换</button>
                <button onclick="clearAllInputs()" class="bg-slate-50 hover:bg-slate-100 dark:bg-slate-900 dark:hover:bg-slate-750 border border-slate-200 dark:border-slate-700 px-3 py-1.5 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-300 cursor-pointer transition-all"><i class="fa-solid fa-trash-can mr-1.5"></i>清空</button>
                <button onclick="runDiffEngine()" class="bg-violet-600 hover:bg-violet-700 text-white px-5 py-1.5 rounded-xl text-xs font-bold shadow-md shadow-violet-500/10 cursor-pointer transition-all"><i class="fa-solid fa-bolt mr-1.5"></i>执行对比</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 overflow-hidden shadow-xs flex flex-col">
                <div class="bg-slate-50/80 dark:bg-slate-900/50 px-4 py-2.5 border-bottom border-slate-200/60 dark:border-slate-700/60 flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>原始文本 / 变更前 (Old)</span>
                    <span id="metaLeft" class="text-2xs font-mono text-slate-400">0 行</span>
                </div>
                <textarea id="leftInput" oninput="scheduleAutoDiff()" placeholder="在此粘贴变更前的原始代码或文本段落..." spellcheck="false" class="w-full min-h-56 p-4 bg-transparent border-0 outline-none font-mono text-xs leading-relaxed text-slate-700 dark:text-slate-300 resize-y"></textarea>
            </div>
            
            <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700/80 overflow-hidden shadow-xs flex flex-col">
                <div class="bg-slate-50/80 dark:bg-slate-900/50 px-4 py-2.5 border-bottom border-slate-200/60 dark:border-slate-700/60 flex justify-between items-center">
                    <span class="text-xs font-bold text-slate-500 flex items-center gap-2"><span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>修改文本 / 变更后 (New)</span>
                    <span id="metaRight" class="text-2xs font-mono text-slate-400">0 行</span>
                </div>
                <textarea id="rightInput" oninput="scheduleAutoDiff()" placeholder="在此
