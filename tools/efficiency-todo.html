<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>优先级待办 - Dev Toolbox</title>
<meta name="description" content="智能优先级待办清单，高价值任务默认显示，中低价值任务折叠隐藏，数据本地持久化。">
<link rel="icon" href="../favicon.ico">
<style>
  :root {
    --bg: #0f1117;
    --bg2: #1a1d27;
    --bg3: #22263a;
    --border: #2e3347;
    --text: #e2e8f0;
    --text2: #94a3b8;
    --text3: #64748b;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    /* Priority colors */
    --high-bg: #1e0a0a;
    --high-border: #7f1d1d;
    --high-dot: #ef4444;
    --high-tag: rgba(239,68,68,0.15);
    --high-tag-text: #f87171;
    --mid-bg: #1c1500;
    --mid-border: #78350f;
    --mid-dot: #f59e0b;
    --mid-tag: rgba(245,158,11,0.15);
    --mid-tag-text: #fbbf24;
    --low-bg: #0a1520;
    --low-border: #1e3a5f;
    --low-dot: #3b82f6;
    --low-tag: rgba(59,130,246,0.15);
    --low-tag-text: #60a5fa;
    --done-text: #4a5568;
    --done-line: var(--text3);
    --progress-bg: #1e2435;
    --progress-fill: #3b82f6;
    --radius: 12px;
    --shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  [data-theme="light"] {
    --bg: #f8fafc;
    --bg2: #ffffff;
    --bg3: #f1f5f9;
    --border: #e2e8f0;
    --text: #1e293b;
    --text2: #475569;
    --text3: #94a3b8;
    --high-bg: #fff5f5;
    --high-border: #fecaca;
    --high-dot: #ef4444;
    --high-tag: #fee2e2;
    --high-tag-text: #dc2626;
    --mid-bg: #fffbeb;
    --mid-border: #fde68a;
    --mid-dot: #f59e0b;
    --mid-tag: #fef3c7;
    --mid-tag-text: #d97706;
    --low-bg: #eff6ff;
    --low-border: #bfdbfe;
    --low-dot: #3b82f6;
    --low-tag: #dbeafe;
    --low-tag-text: #2563eb;
    --done-text: #94a3b8;
    --progress-bg: #e2e8f0;
    --progress-fill: #3b82f6;
    --shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    padding-bottom: 80px;
  }

  /* Aurora header */
  .page-header {
    position: relative;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow: hidden;
    padding: 28px 24px 20px;
  }
  .page-header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 60% 80% at 20% 50%, rgba(239,68,68,0.08) 0%, transparent 70%),
                radial-gradient(ellipse 40% 60% at 80% 30%, rgba(245,158,11,0.06) 0%, transparent 70%),
                radial-gradient(ellipse 30% 50% at 50% 80%, rgba(59,130,246,0.07) 0%, transparent 70%);
    pointer-events: none;
  }
  .header-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 16px;
    position: relative;
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--text2);
    text-decoration: none;
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg3);
    transition: all .2s;
    white-space: nowrap;
  }
  .back-btn:hover { color: var(--text); border-color: var(--accent); }
  .header-title { flex: 1; }
  .header-title h1 { font-size: 20px; font-weight: 700; line-height: 1.3; }
  .header-title p { font-size: 13px; color: var(--text2); margin-top: 3px; }
  .theme-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
    transition: all .2s;
  }
  .theme-btn:hover { border-color: var(--accent); }
  .fav-btn {
    width: 36px; height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    transition: all .2s;
  }
  .fav-btn:hover { border-color: var(--accent); }
  .fav-btn.active { color: #fbbf24; border-color: #fbbf24; background: rgba(251,191,36,0.1); }

  .main { max-width: 760px; margin: 0 auto; padding: 20px 16px; }

  /* Progress bar */
  .progress-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .progress-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .progress-label { font-size: 13px; font-weight: 600; color: var(--text2); }
  .progress-pct { font-size: 24px; font-weight: 700; color: var(--text); }
  .progress-track {
    height: 6px;
    background: var(--progress-bg);
    border-radius: 999px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    background: linear-gradient(90deg, #3b82f6, #60a5fa);
    border-radius: 999px;
    transition: width .4s ease;
  }
  .progress-meta { margin-top: 8px; font-size: 12px; color: var(--text3); display: flex; gap: 16px; }

  /* Add task */
  .add-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .add-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .add-input {
    flex: 1;
    min-width: 200px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 14px;
    color: var(--text);
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .add-input:focus { border-color: var(--accent); }
  .add-input::placeholder { color: var(--text3); }
  .pri-select {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 9px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
    transition: border-color .2s;
  }
  .pri-select:focus { border-color: var(--accent); }
  .btn-add {
    padding: 9px 20px;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    white-space: nowrap;
  }
  .btn-add:hover { background: var(--accent-hover); }

  /* Section group */
  .section {
    margin-bottom: 16px;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 8px;
  }
  .section-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); }
  .section-count {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg3);
    color: var(--text3);
    font-weight: 600;
  }
  .section-toggle {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text3);
    font-size: 12px;
    padding: 3px 10px;
    cursor: pointer;
    transition: all .2s;
  }
  .section-toggle:hover { border-color: var(--accent); color: var(--accent); }

  .task-list { display: flex; flex-direction: column; gap: 8px; }

  /* Task card */
  .task-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    align-items: flex-start;
    gap: 12px;
    transition: all .2s;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    position: relative;
  }
  .task-card:hover { border-color: var(--accent); transform: translateY(-1px); }
  .task-card.done { opacity: .55; }
  .task-card.done .task-text { text-decoration: line-through; color: var(--done-text); }
  .task-card.high { border-left: 3px solid var(--high-dot); }
  .task-card.mid  { border-left: 3px solid var(--mid-dot); }
  .task-card.low  { border-left: 3px solid var(--low-dot); }

  .task-check {
    width: 18px; height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    background: transparent;
    cursor: pointer;
    flex-shrink: 0;
    margin-top: 2px;
    appearance: none;
    -webkit-appearance: none;
    position: relative;
    transition: all .2s;
  }
  .task-check:checked {
    background: var(--accent);
    border-color: var(--accent);
  }
  .task-check:checked::after {
    content: '';
    position: absolute;
    top: 2px; left: 5px;
    width: 5px; height: 9px;
    border: 2px solid #fff;
    border-top: none;
    border-left: none;
    transform: rotate(45deg);
  }
  .task-check.high:not(:checked) { border-color: var(--high-dot); }
  .task-check.mid:not(:checked)  { border-color: var(--mid-dot); }
  .task-check.low:not(:checked)  { border-color: var(--low-dot); }

  .task-body { flex: 1; min-width: 0; }
  .task-text-row { display: flex; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
  .task-text {
    font-size: 14px;
    line-height: 1.5;
    flex: 1;
    word-break: break-word;
    cursor: pointer;
    padding: 1px 4px;
    border-radius: 4px;
    border: 1px solid transparent;
    outline: none;
    transition: border-color .2s;
  }
  .task-text[contenteditable="true"] {
    border-color: var(--accent);
    background: var(--bg3);
  }
  .task-meta { font-size: 11px; color: var(--text3); margin-top: 4px; }

  .pri-badge {
    font-size: 10px;
    font-weight: 700;
    padding: 2px 7px;
    border-radius: 999px;
    text-transform: uppercase;
    letter-spacing: .05em;
    flex-shrink: 0;
    margin-top: 2px;
  }
  .pri-badge.high { background: var(--high-tag); color: var(--high-tag-text); }
  .pri-badge.mid  { background: var(--mid-tag);  color: var(--mid-tag-text); }
  .pri-badge.low  { background: var(--low-tag);  color: var(--low-tag-text); }

  .task-actions { display: flex; gap: 4px; flex-shrink: 0; }
  .action-btn {
    width: 28px; height: 28px;
    border-radius: 6px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--text3);
    cursor: pointer;
    font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: all .2s;
  }
  .action-btn:hover { background: var(--bg3); border-color: var(--border); color: var(--text); }
  .action-btn.del:hover { color: #ef4444; border-color: #ef4444; }

  /* Empty placeholder */
  .section-empty {
    text-align: center;
    padding: 20px;
    color: var(--text3);
    font-size: 13px;
    font-style: italic;
    border: 1px dashed var(--border);
    border-radius: 10px;
  }

  /* Done section */
  .done-section { margin-top: 24px; }
  .done-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  .done-divider::before, .done-divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }
  .done-divider-label {
    font-size: 11px;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: .08em;
    white-space: nowrap;
    font-weight: 600;
  }

  /* Collapse animation helper */
  .collapsible { overflow: hidden; transition: max-height .3s ease; }

  /* Clear all btn */
  .toolbar { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 8px; }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text3);
    font-size: 12px;
    padding: 5px 12px;
    cursor: pointer;
    transition: all .2s;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px; right: 24px;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 18px;
    font-size: 13px;
    color: var(--text);
    box-shadow: var(--shadow);
    transform: translateY(80px);
    opacity: 0;
    transition: all .3s;
    z-index: 9999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  @media (max-width: 500px) {
    .add-row { flex-direction: column; }
    .add-input { min-width: 0; width: 100%; }
  }
</style>
</head>
<body>

<header class="page-header">
  <div class="header-inner">
    <a href="../index.html" class="back-btn">← 返回首页</a>
    <div class="header-title">
      <h1>优先级待办</h1>
      <p>高价值任务默认显示 · 中低优先级自动折叠 · 本地持久化</p>
    </div>
    <button class="fav-btn" id="favBtn" title="收藏此工具">☆</button>
    <button class="theme-btn" id="themeBtn" title="切换主题">☀️</button>
  </div>
</header>

<div class="main">

  <!-- Progress card -->
  <div class="progress-card">
    <div class="progress-header">
      <div>
        <div class="progress-label">整体进度</div>
        <div class="progress-meta" id="progressMeta">0 个待完成 · 0 个已完成</div>
      </div>
      <div class="progress-pct" id="progressPct">0%</div>
    </div>
    <div class="progress-track">
      <div class="progress-bar" id="progressBar" style="width:0%"></div>
    </div>
  </div>

  <!-- Add task -->
  <div class="add-card">
    <div class="add-row">
      <input type="text" class="add-input" id="addInput" placeholder="新建待办任务…" maxlength="200">
      <select class="pri-select" id="priSelect">
        <option value="high">高优先级</option>
        <option value="mid">中优先级</option>
        <option value="low">低优先级</option>
      </select>
      <button class="btn-add" id="addBtn">+ 添加</button>
    </div>
  </div>

  <div class="toolbar">
    <button class="btn-ghost" id="clearDoneBtn">清除已完成</button>
    <button class="btn-ghost" id="clearAllBtn">清空全部</button>
  </div>

  <!-- High priority section (always visible) -->
  <div class="section" id="section-high">
    <div class="section-header">
      <div class="section-dot" style="background:var(--high-dot)"></div>
      <div class="section-title">高优先级</div>
      <div class="section-count" id="count-high">0</div>
    </div>
    <div class="task-list" id="list-high"></div>
  </div>

  <!-- Mid priority section (collapsible) -->
  <div class="section" id="section-mid">
    <div class="section-header">
      <div class="section-dot" style="background:var(--mid-dot)"></div>
      <div class="section-title">中优先级</div>
      <div class="section-count" id="count-mid">0</div>
      <button class="section-toggle" id="toggle-mid" data-open="false">展开 0 个任务</button>
    </div>
    <div class="collapsible" id="collapse-mid" style="max-height:0">
      <div class="task-list" id="list-mid"></div>
    </div>
  </div>

  <!-- Low priority section (collapsible) -->
  <div class="section" id="section-low">
    <div class="section-header">
      <div class="section-dot" style="background:var(--low-dot)"></div>
      <div class="section-title">低优先级</div>
      <div class="section-count" id="count-low">0</div>
      <button class="section-toggle" id="toggle-low" data-open="false">展开 0 个任务</button>
    </div>
    <div class="collapsible" id="collapse-low" style="max-height:0">
      <div class="task-list" id="list-low"></div>
    </div>
  </div>

  <!-- Done section -->
  <div class="done-section" id="done-section" style="display:none">
    <div class="done-divider">
      <div class="done-divider-label">已完成 (<span id="done-count">0</span>)</div>
    </div>
    <div class="task-list" id="list-done"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
(function() {
  'use strict';

  // --- Theme ---
  const savedTheme = localStorage.getItem('toolbox_theme') || 'dark';
  document.documentElement.dataset.theme = savedTheme;
  const themeBtn = document.getElementById('themeBtn');
  themeBtn.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
  themeBtn.addEventListener('click', () => {
    const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = t;
    localStorage.setItem('toolbox_theme', t);
    themeBtn.textContent = t === 'dark' ? '☀️' : '🌙';
  });

  // --- Favorites ---
  const FAV_KEY = 'toolbox_favorites_v2';
  const TOOL_ID = 'efficiency-todo';
  function getFavs() { try { return JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch { return []; } }
  function setFavs(arr) { localStorage.setItem(FAV_KEY, JSON.stringify(arr)); }
  const favBtn = document.getElementById('favBtn');
  const favs = getFavs();
  if (favs.includes(TOOL_ID)) { favBtn.classList.add('active'); favBtn.textContent = '★'; }
  favBtn.addEventListener('click', () => {
    const arr = getFavs();
    if (arr.includes(TOOL_ID)) {
      setFavs(arr.filter(x => x !== TOOL_ID));
      favBtn.classList.remove('active');
      favBtn.textContent = '☆';
    } else {
      setFavs([TOOL_ID, ...arr.filter(x => x !== TOOL_ID)]);
      favBtn.classList.add('active');
      favBtn.textContent = '★';
    }
  });

  // --- Data ---
  const STORAGE_KEY = 'priority_todo_v1';
  let tasks = [];

  function loadTasks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) tasks = JSON.parse(raw);
    } catch { tasks = []; }
  }

  function saveTasks() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const now = new Date();
    const diff = now - d;
    if (diff < 60000) return '刚刚';
    if (diff < 3600000) return Math.floor(diff/60000) + ' 分钟前';
    if (diff < 86400000) return Math.floor(diff/3600000) + ' 小时前';
    return d.getMonth()+1 + '月' + d.getDate() + '日';
  }

  // --- Render ---
  function renderAll() {
    const high = tasks.filter(t => !t.done && t.priority === 'high');
    const mid  = tasks.filter(t => !t.done && t.priority === 'mid');
    const low  = tasks.filter(t => !t.done && t.priority === 'low');
    const done = tasks.filter(t => t.done);

    renderList('high', high);
    renderList('mid', mid);
    renderList('low', low);
    renderDone(done);

    // Counts
    document.getElementById('count-high').textContent = high.length;
    document.getElementById('count-mid').textContent  = mid.length;
    document.getElementById('count-low').textContent  = low.length;
    document.getElementById('done-count').textContent = done.length;

    // Collapse toggles
    updateToggle('mid', mid.length);
    updateToggle('low', low.length);

    // Done section visibility
    document.getElementById('done-section').style.display = done.length ? '' : 'none';

    // Progress
    const total = tasks.length;
    const doneCount = done.length;
    const pct = total > 0 ? Math.round(doneCount / total * 100) : 0;
    document.getElementById('progressPct').textContent = pct + '%';
    document.getElementById('progressBar').style.width = pct + '%';
    document.getElementById('progressMeta').textContent =
      `${total - doneCount} 个待完成 · ${doneCount} 个已完成`;
  }

  function updateToggle(pri, count) {
    const toggle = document.getElementById('toggle-' + pri);
    const isOpen = toggle.dataset.open === 'true';
    toggle.textContent = isOpen ? '收起' : `展开 ${count} 个任务`;
  }

  function renderList(pri, items) {
    const el = document.getElementById('list-' + pri);
    if (items.length === 0) {
      el.innerHTML = `<div class="section-empty">暂无${priLabel(pri)}任务</div>`;
      return;
    }
    el.innerHTML = items.map(t => taskHTML(t)).join('');
    bindTaskEvents(el);
  }

  function renderDone(items) {
    const el = document.getElementById('list-done');
    if (items.length === 0) { el.innerHTML = ''; return; }
    el.innerHTML = items.map(t => taskHTML(t)).join('');
    bindTaskEvents(el);
  }

  function priLabel(pri) {
    return { high: '高优先级', mid: '中优先级', low: '低优先级' }[pri] || '';
  }

  function priLabelShort(pri) {
    return { high: '高', mid: '中', low: '低' }[pri] || '';
  }

  function taskHTML(t) {
    const checkedAttr = t.done ? 'checked' : '';
    const doneClass = t.done ? 'done' : '';
    const pri = t.done ? '' : t.priority;
    return `
      <div class="task-card ${t.priority} ${doneClass}" data-id="${t.id}">
        <input type="checkbox" class="task-check ${t.priority}" ${checkedAttr} data-action="toggle" data-id="${t.id}">
        <div class="task-body">
          <div class="task-text-row">
            <div class="task-text" contenteditable="false" data-action="edit" data-id="${t.id}">${escHtml(t.text)}</div>
            ${!t.done ? `<span class="pri-badge ${t.priority}">${priLabelShort(t.priority)}</span>` : ''}
          </div>
          <div class="task-meta">${formatDate(t.createdAt)}</div>
        </div>
        <div class="task-actions">
          ${!t.done ? `<button class="action-btn" data-action="promote" data-id="${t.id}" title="升级优先级">↑</button>` : ''}
          <button class="action-btn del" data-action="delete" data-id="${t.id}" title="删除">✕</button>
        </div>
      </div>
    `;
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function bindTaskEvents(container) {
    container.addEventListener('click', handleTaskClick);
    container.addEventListener('dblclick', handleDblClick);
  }

  function handleTaskClick(e) {
    const el = e.target.closest('[data-action]');
    if (!el) return;
    const action = el.dataset.action;
    const id = el.dataset.id;

    if (action === 'toggle') {
      const t = tasks.find(x => x.id === id);
      if (t) { t.done = !t.done; saveTasks(); renderAll(); }
    } else if (action === 'delete') {
      tasks = tasks.filter(x => x.id !== id);
      saveTasks(); renderAll();
      toast('已删除');
    } else if (action === 'promote') {
      const t = tasks.find(x => x.id === id);
      if (t) {
        if (t.priority === 'low') t.priority = 'mid';
        else if (t.priority === 'mid') t.priority = 'high';
        saveTasks(); renderAll();
        toast('已升级为' + priLabel(t.priority));
      }
    }
  }

  function handleDblClick(e) {
    const el = e.target.closest('[data-action="edit"]');
    if (!el) return;
    const id = el.dataset.id;
    const t = tasks.find(x => x.id === id);
    if (!t || t.done) return;

    el.contentEditable = 'true';
    el.focus();
    // Move cursor to end
    const range = document.createRange();
    range.selectNodeContents(el);
    range.collapse(false);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    function finish() {
      el.contentEditable = 'false';
      const newText = el.textContent.trim();
      if (newText && newText !== t.text) {
        t.text = newText;
        saveTasks();
        toast('已保存');
      } else {
        el.textContent = t.text;
      }
      el.removeEventListener('blur', finish);
      el.removeEventListener('keydown', onKey);
    }
    function onKey(ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); finish(); }
      if (ev.key === 'Escape') { el.textContent = t.text; el.contentEditable='false'; el.removeEventListener('blur', finish); el.removeEventListener('keydown', onKey); }
    }
    el.addEventListener('blur', finish);
    el.addEventListener('keydown', onKey);
  }

  // --- Collapse toggles ---
  ['mid', 'low'].forEach(pri => {
    document.getElementById('toggle-' + pri).addEventListener('click', function() {
      const isOpen = this.dataset.open === 'true';
      const collapse = document.getElementById('collapse-' + pri);
      if (isOpen) {
        collapse.style.maxHeight = '0';
        this.dataset.open = 'false';
        const count = tasks.filter(t => !t.done && t.priority === pri).length;
        this.textContent = `展开 ${count} 个任务`;
      } else {
        collapse.style.maxHeight = collapse.scrollHeight + 5000 + 'px';
        this.dataset.open = 'true';
        this.textContent = '收起';
      }
    });
  });

  // --- Add task ---
  function addTask() {
    const input = document.getElementById('addInput');
    const text = input.value.trim();
    if (!text) { input.focus(); return; }
    const pri = document.getElementById('priSelect').value;
    tasks.unshift({
      id: genId(),
      text,
      priority: pri,
      done: false,
      createdAt: Date.now()
    });
    saveTasks();
    renderAll();
    input.value = '';
    input.focus();
    // Auto-open the section if mid/low
    if (pri !== 'high') {
      const toggle = document.getElementById('toggle-' + pri);
      if (toggle.dataset.open !== 'true') toggle.click();
    }
    toast('已添加到' + priLabel(pri));
  }

  document.getElementById('addBtn').addEventListener('click', addTask);
  document.getElementById('addInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  // --- Clear buttons ---
  document.getElementById('clearDoneBtn').addEventListener('click', () => {
    const count = tasks.filter(t => t.done).length;
    if (!count) { toast('没有已完成的任务'); return; }
    tasks = tasks.filter(t => !t.done);
    saveTasks(); renderAll();
    toast(`已清除 ${count} 个已完成任务`);
  });

  document.getElementById('clearAllBtn').addEventListener('click', () => {
    if (!tasks.length) { toast('列表已经是空的'); return; }
    if (!confirm('确定清空所有任务吗？此操作不可撤销。')) return;
    tasks = [];
    saveTasks(); renderAll();
    toast('已清空全部任务');
  });

  // --- Toast ---
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2200);
  }

  // --- Init ---
  loadTasks();
  renderAll();
})();
</script>
</body>
</html>
