<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日高价值清单 - 极简Todo待办工具 | 全能工具箱</title>
    <meta name="description" content="免费在线极简待办清单，按高/中/低价值分级管理任务，默认只显示高价值任务，数据自动保存至本地，简洁高效。">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
    <style>
        :root{--bg:#f8fafc;--bg2:#f1f5f9;--card:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--primary:#4F46E5;--primary-light:#EEF2FF;--success:#10B981;--success-light:#ECFDF5;--warning:#F59E0B;--warning-light:#FFFBEB;--error:#EF4444;--border:#e2e8f0;--radius:12px;--high-color:#dc2626;--high-bg:#fef2f2;--high-border:#fecaca;--mid-color:#d97706;--mid-bg:#fffbeb;--mid-border:#fde68a;--low-color:#64748b;--low-bg:#f8fafc;--low-border:#e2e8f0}
        .dark{--bg:#0f172a;--bg2:#1e293b;--card:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--border:#334155;--primary-light:rgba(79,70,229,.2);--success-light:rgba(16,185,129,.15);--high-bg:rgba(220,38,38,.12);--high-border:rgba(220,38,38,.3);--mid-bg:rgba(217,119,6,.12);--mid-border:rgba(217,119,6,.3);--low-bg:rgba(100,116,139,.1);--low-border:rgba(100,116,139,.2)}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
        a{color:inherit;text-decoration:none}
        .header{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border)}
        .header-inner{max-width:680px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
        .icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;background:none;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.2s}
        .icon-btn:hover{background:var(--bg2)}
        .dark .icon-btn{color:var(--text)}
        .main{max-width:680px;margin:0 auto;padding:24px 20px 60px}
        .breadcrumb{display:flex;gap:8px;font-size:13px;color:var(--text3);margin-bottom:20px;flex-wrap:wrap}
        .breadcrumb a{color:var(--primary)}
        .tool-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:10px}
        .tool-title{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px}
        .tool-desc{color:var(--text2);margin-bottom:24px;font-size:15px}
        .tool-fav-btn{padding:8px 18px;font-size:14px;background:var(--card);border:1px solid var(--border);border-radius:50px;cursor:pointer;transition:.2s;color:var(--text2)}
        .tool-fav-btn:hover,.tool-fav-btn.active{color:var(--warning);border-color:var(--warning)}

        /* 日期条 */
        .date-bar{background:linear-gradient(135deg,var(--primary),#6366f1);color:#fff;border-radius:var(--radius);padding:16px 20px;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
        .date-text{font-size:16px;font-weight:700}
        .date-sub{font-size:13px;opacity:.85;margin-top:2px}
        .progress-wrap{display:flex;align-items:center;gap:10px}
        .progress-bar{width:120px;height:8px;background:rgba(255,255,255,.3);border-radius:4px;overflow:hidden}
        .progress-fill{height:100%;background:#fff;border-radius:4px;transition:width .4s}
        .progress-label{font-size:13px;opacity:.9;white-space:nowrap}

        /* 输入区 */
        .add-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:20px}
        .add-row{display:flex;gap:10px;align-items:stretch}
        .task-input{flex:1;padding:12px 14px;font-size:15px;background:var(--bg2);border:2px solid var(--border);border-radius:10px;color:var(--text);outline:none;transition:.2s}
        .task-input:focus{border-color:var(--primary);background:var(--card);box-shadow:0 0 0 4px var(--primary-light)}
        .task-input::placeholder{color:var(--text3)}
        .priority-sel{padding:12px 10px;font-size:14px;background:var(--bg2);border:2px solid var(--border);border-radius:10px;color:var(--text);outline:none;cursor:pointer;transition:.2s}
        .priority-sel:focus{border-color:var(--primary)}
        .add-btn{padding:12px 20px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;white-space:nowrap}
        .add-btn:hover{opacity:.9;transform:translateY(-1px)}

        /* 统计行 */
        .stats-row{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
        .stat-chip{padding:7px 14px;background:var(--card);border:1px solid var(--border);border-radius:50px;font-size:13px;color:var(--text2);display:flex;align-items:center;gap:6px}
        .stat-num{font-weight:700;font-size:15px}
        .stat-high{color:var(--high-color)}
        .stat-mid{color:var(--mid-color)}
        .stat-done{color:var(--success)}

        /* 分组标签 */
        .group-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;margin-top:24px}
        .group-header:first-of-type{margin-top:0}
        .group-label{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
        .priority-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
        .pd-high{background:var(--high-color)}
        .pd-mid{background:var(--mid-color)}
        .pd-low{background:var(--low-color)}
        .group-count{font-size:12px;background:var(--bg2);padding:2px 10px;border-radius:50px;color:var(--text3)}

        /* 任务卡片 */
        .task-list{display:flex;flex-direction:column;gap:8px}
        .task-card{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;background:var(--card);border:1.5px solid var(--border);border-radius:12px;transition:all .2s;position:relative;animation:slideIn .2s ease}
        @keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
        .task-card:hover{box-shadow:0 4px 12px rgba(0,0,0,.07);transform:translateY(-1px)}
        .task-card.priority-high{border-color:var(--high-border);background:var(--high-bg)}
        .task-card.priority-mid{border-color:var(--mid-border);background:var(--mid-bg)}
        .task-card.priority-low{border-color:var(--low-border)}
        .task-card.done{opacity:.55}
        .task-card.done .task-text{text-decoration:line-through;color:var(--text3)}
        .task-check{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s;margin-top:1px;background:var(--card)}
        .task-check:hover{border-color:var(--primary)}
        .task-check.checked{background:var(--success);border-color:var(--success);color:#fff}
        .task-body{flex:1;min-width:0}
        .task-text{font-size:15px;word-break:break-word;line-height:1.5}
        .task-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
        .priority-badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:700}
        .pb-high{background:var(--high-bg);color:var(--high-color);border:1px solid var(--high-border)}
        .pb-mid{background:var(--mid-bg);color:var(--mid-color);border:1px solid var(--mid-border)}
        .pb-low{background:var(--low-bg);color:var(--low-color);border:1px solid var(--low-border)}
        .task-time{font-size:11px;color:var(--text3)}
        .task-actions{display:flex;gap:4px;opacity:0;transition:.2s;flex-shrink:0}
        .task-card:hover .task-actions{opacity:1}
        .action-btn{width:28px;height:28px;border:none;background:var(--bg2);border-radius:6px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.2s;color:var(--text2)}
        .action-btn:hover{background:var(--error);color:#fff}
        .action-btn.edit-btn:hover{background:var(--primary);color:#fff}

        /* 展开低价值 */
        .toggle-btn{width:100%;padding:10px;background:none;border:1.5px dashed var(--border);border-radius:10px;cursor:pointer;font-size:13px;color:var(--text3);transition:.2s;margin-top:8px}
        .toggle-btn:hover{border-color:var(--primary);color:var(--primary)}

        /* 空态 */
        .empty-group{padding:24px;text-align:center;color:var(--text3);font-size:14px;background:var(--bg2);border-radius:10px}

        /* 已完成清单 */
        .done-section{margin-top:32px;border-top:1px dashed var(--border);padding-top:20px}
        .done-toggle{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--text2);cursor:pointer;margin-bottom:12px;user-select:none}

        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 24px;background:var(--text);color:#fff;border-radius:50px;font-size:14px;opacity:0;transition:.3s;z-index:999;pointer-events:none}
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
        .toast.success{background:var(--success)}
        .footer{margin-top:60px;padding:24px 20px;border-top:1px solid var(--border);text-align:center;font-size:13px;color:var(--text3)}
        .footer a{color:var(--primary)}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="../" class="logo"><span>🛠️</span><span>全能工具箱</span></a>
            <div style="display:flex;gap:8px">
                <button class="icon-btn" id="clearDoneBtn" title="清除已完成" onclick="clearDone()" style="font-size:14px;color:var(--text2)">🗑️</button>
                <button class="icon-btn" id="themeBtn" title="切换主题"><span id="themeIcon">🌙</span></button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="breadcrumb">
            <a href="../">首页</a>
            <span>›</span>
            <span>效率工具</span>
            <span>›</span>
            <span>高价值清单</span>
        </div>

        <div class="tool-header">
            <h1 class="tool-title">✅ 每日高价值清单</h1>
            <button class="tool-fav-btn" id="favBtn" data-tool-id="efficiency-todo">☆ 收藏</button>
        </div>
        <p class="tool-desc">按价值等级管理任务，默认只显示高价值任务，让你专注最重要的事。数据自动保存在本地。</p>

        <!-- 日期条 -->
        <div class="date-bar">
            <div>
                <div class="date-text" id="dateText"></div>
                <div class="date-sub" id="dateSubText"></div>
            </div>
            <div class="progress-wrap">
                <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
                <span class="progress-label" id="progressLabel">0 / 0 完成</span>
            </div>
        </div>

        <!-- 统计 -->
        <div class="stats-row" id="statsRow"></div>

        <!-- 输入区 -->
        <div class="add-card">
            <div class="add-row">
                <input class="task-input" id="taskInput" type="text" placeholder="添加任务…" maxlength="200" autocomplete="off">
                <select class="priority-sel" id="prioritySel">
                    <option value="high">🔴 高价值</option>
                    <option value="mid">🟡 中价值</option>
                    <option value="low">⚪ 低价值</option>
                </select>
                <button class="add-btn" onclick="addTask()">添加</button>
            </div>
        </div>

        <!-- 任务列表 -->
        <div id="taskBoard"></div>

        <!-- 已完成 -->
        <div class="done-section" id="doneSection" style="display:none">
            <div class="done-toggle" onclick="toggleDone()">
                <span id="doneArrow">▶</span>
                <span>已完成任务</span>
                <span class="group-count" id="doneCountBadge">0</span>
            </div>
            <div id="doneList" style="display:none"></div>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 <a href="../">全能工具箱</a> | 数据保存在本地 localStorage，不上传</p>
    </footer>
    <div id="toast" class="toast"></div>

    <script src="../js/tools-data.js"></script>
    <script src="../js/toolbox-core.js"></script>
    <script>
        const STORE_KEY = 'toolbox_todo_v1';
        let tasks = [];
        let lowExpanded = false;
        let midExpanded = false;
        let doneExpanded = false;
        let editingId = null;

        function load() {
            try { tasks = JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch { tasks = []; }
        }

        function save() {
            localStorage.setItem(STORE_KEY, JSON.stringify(tasks));
        }

        function newId() {
            return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        }

        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (!text) { input.focus(); return; }
            const priority = document.getElementById('prioritySel').value;
            tasks.unshift({ id: newId(), text, priority, done: false, created: Date.now() });
            save();
            input.value = '';
            input.focus();
            render();
            toast('任务已添加', 'success');
        }

        function toggleDone(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            task.done = !task.done;
            if (task.done) task.doneAt = Date.now();
            save();
            render();
        }

        function deleteTask(id) {
            tasks = tasks.filter(t => t.id !== id);
            save();
            render();
            toast('已删除', '');
        }

        function clearDone() {
            const cnt = tasks.filter(t => t.done).length;
            if (!cnt) { toast('没有已完成的任务', ''); return; }
            tasks = tasks.filter(t => !t.done);
            save();
            render();
            toast(`已清除 ${cnt} 条完成任务`, '');
        }

        function startEdit(id) {
            editingId = id;
            render();
            const inp = document.getElementById('edit-' + id);
            if (inp) { inp.focus(); inp.select(); }
        }

        function saveEdit(id) {
            const inp = document.getElementById('edit-' + id);
            if (!inp) return;
            const val = inp.value.trim();
            if (val) {
                const task = tasks.find(t => t.id === id);
                if (task) task.text = val;
                save();
            }
            editingId = null;
            render();
        }

        function formatTime(ts) {
            const now = Date.now();
            const diff = now - ts;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
            return new Date(ts).toLocaleDateString('zh-CN', { month:'numeric', day:'numeric' });
        }

        function renderCard(t) {
            const badge = { high: '<span class="priority-badge pb-high">高价值</span>', mid: '<span class="priority-badge pb-mid">中价值</span>', low: '<span class="priority-badge pb-low">低价值</span>' };
            const checkClass = t.done ? 'task-check checked' : 'task-check';
            const checkContent = t.done ? '✓' : '';
            const cardClass = `task-card priority-${t.priority}${t.done ? ' done' : ''}`;

            const textPart = editingId === t.id
                ? `<input id="edit-${t.id}" value="${escAttr(t.text)}" style="width:100%;padding:4px 6px;font-size:15px;border:1.5px solid var(--primary);border-radius:6px;background:var(--card);color:var(--text);outline:none"
                    onkeydown="if(event.key==='Enter')saveEdit('${t.id}');if(event.key==='Escape'){editingId=null;render();}"
                    onblur="saveEdit('${t.id}')">`
                : `<div class="task-text">${escHtml(t.text)}</div>`;

            return `<div class="${cardClass}" id="card-${t.id}">
                <div class="${checkClass}" onclick="toggleDone('${t.id}')">${checkContent}</div>
                <div class="task-body">
                    ${textPart}
                    <div class="task-meta">${badge[t.priority]}<span class="task-time">${formatTime(t.created)}</span></div>
                </div>
                <div class="task-actions">
                    <button class="action-btn edit-btn" title="编辑" onclick="startEdit('${t.id}')">✏️</button>
                    <button class="action-btn" title="删除" onclick="deleteTask('${t.id}')">🗑️</button>
                </div>
            </div>`;
        }

        function render() {
            // Date bar
            const now = new Date();
            const days = ['日','一','二','三','四','五','六'];
            document.getElementById('dateText').textContent = now.toLocaleDateString('zh-CN', { year:'numeric', month:'long', day:'numeric' });
            document.getElementById('dateSubText').textContent = `星期${days[now.getDay()]}`;

            const active = tasks.filter(t => !t.done);
            const done = tasks.filter(t => t.done);
            const total = tasks.length;
            const donePct = total ? Math.round(done.length / total * 100) : 0;
            document.getElementById('progressFill').style.width = donePct + '%';
            document.getElementById('progressLabel').textContent = `${done.length} / ${total} 完成`;

            // Stats
            const high = active.filter(t => t.priority === 'high');
            const mid = active.filter(t => t.priority === 'mid');
            const low = active.filter(t => t.priority === 'low');
            document.getElementById('statsRow').innerHTML = `
                <div class="stat-chip"><span class="stat-num stat-high">${high.length}</span> 高价值</div>
                <div class="stat-chip"><span class="stat-num stat-mid">${mid.length}</span> 中价值</div>
                <div class="stat-chip" style="color:var(--text3)"><span class="stat-num" style="color:var(--text2)">${low.length}</span> 低价值</div>
                <div class="stat-chip"><span class="stat-num stat-done">${done.length}</span> 已完成</div>
            `;

            // Board
            let html = '';

            // High priority group
            html += `<div class="group-header">
                <div class="group-label"><div class="priority-dot pd-high"></div>高价值任务</div>
                <span class="group-count">${high.length}</span>
            </div>`;
            if (high.length) {
                html += `<div class="task-list">${high.map(renderCard).join('')}</div>`;
            } else {
                html += `<div class="empty-group">暂无高价值任务，专注才是最大的财富 🎯</div>`;
            }

            // Mid priority group (collapsed by default)
            html += `<div class="group-header" style="margin-top:28px">
                <div class="group-label"><div class="priority-dot pd-mid"></div>中价值任务</div>
                <span class="group-count">${mid.length}</span>
            </div>`;
            if (mid.length) {
                if (midExpanded) {
                    html += `<div class="task-list">${mid.map(renderCard).join('')}</div>`;
                    html += `<button class="toggle-btn" onclick="midExpanded=false;render()">▲ 收起中价值任务</button>`;
                } else {
                    html += `<button class="toggle-btn" onclick="midExpanded=true;render()">▼ 展开 ${mid.length} 条中价值任务</button>`;
                }
            } else {
                html += `<div class="empty-group" style="font-size:13px;padding:16px">暂无中价值任务</div>`;
            }

            // Low priority group (collapsed by default)
            html += `<div class="group-header" style="margin-top:28px">
                <div class="group-label"><div class="priority-dot pd-low"></div>低价值任务</div>
                <span class="group-count">${low.length}</span>
            </div>`;
            if (low.length) {
                if (lowExpanded) {
                    html += `<div class="task-list">${low.map(renderCard).join('')}</div>`;
                    html += `<button class="toggle-btn" onclick="lowExpanded=false;render()">▲ 收起低价值任务</button>`;
                } else {
                    html += `<button class="toggle-btn" onclick="lowExpanded=true;render()">▼ 展开 ${low.length} 条低价值任务（这些任务优先级较低，稍后处理）</button>`;
                }
            } else {
                html += `<div class="empty-group" style="font-size:13px;padding:16px">暂无低价值任务</div>`;
            }

            document.getElementById('taskBoard').innerHTML = html;

            // Done section
            const doneSection = document.getElementById('doneSection');
            if (done.length) {
                doneSection.style.display = '';
                document.getElementById('doneCountBadge').textContent = done.length;
                document.getElementById('doneArrow').textContent = doneExpanded ? '▼' : '▶';
                if (doneExpanded) {
                    document.getElementById('doneList').style.display = '';
                    document.getElementById('doneList').innerHTML = `<div class="task-list">${done.map(renderCard).join('')}</div>`;
                } else {
                    document.getElementById('doneList').style.display = 'none';
                }
            } else {
                doneSection.style.display = 'none';
            }
        }

        function toggleDone() {
            doneExpanded = !doneExpanded;
            render();
        }

        function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function escAttr(s) { return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

        function toast(msg, type) {
            const el = document.getElementById('toast');
            el.textContent = msg;
            el.className = 'toast show' + (type ? ' ' + type : '');
            clearTimeout(el._t);
            el._t = setTimeout(() => el.className = 'toast', 2500);
        }

        // Enter to add
        document.getElementById('taskInput').addEventListener('keydown', e => {
            if (e.key === 'Enter') addTask();
        });

        // Init
        load();
        render();

        // Theme
        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');
        function updateThemeIcon() { themeIcon.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙'; }
        updateThemeIcon();
        themeBtn.addEventListener('click', () => {
            const dark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', dark ? 'dark' : 'light');
            updateThemeIcon();
        });
    </script>
</body>
</html>
