<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 文本/图片在线编解码器 - 全能工具箱 V2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aurora-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            background-size: 200% 200%;
            animation: aurora-animation 15s ease infinite;
        }
        @keyframes aurora-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <header class="aurora-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <a href="../index.html" class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl transition-all duration-200 flex items-center justify-center backdrop-blur-md border border-white/10" title="返回主页">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2">
                        Base64 编解码器
                    </h1>
                    <p class="text-white/80 text-sm mt-0.5">支持纯文本与图片的 Base64 互转，纯前端解析，隐私安全无忧</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="favBtn" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-2 backdrop-blur-md border border-white/10">
                    <i class="fa-regular fa-star" id="favIcon"></i>
                    <span id="favText">加入收藏</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        <div class="flex gap-2 mb-6 bg-slate-200/60 p-1 rounded-xl w-fit">
            <button onclick="switchTab('text')" id="tab-text" class="px-5 py-2 rounded-lg text-sm font-semibold transition-all shadow-sm bg-white text-slate-800">
                <i class="fa-solid fa-font mr-2 text-violet-500"></i>文本编解码
            </button>
            <button onclick="switchTab('image')" id="tab-image" class="px-5 py-2 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-800">
                <i class="fa-solid fa-image mr-2 text-pink-500"></i>图片转 Base64
            </button>
        </div>

        <div id="textSection" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-700 mb-2 flex items-center justify-between">
                        <span>输入原始文本 或 Base64 字符串</span>
                        <button onclick="clearAll('rawInput')" class="text-xs font-normal text-slate-400 hover:text-slate-600"><i class="fa-solid fa-trash-can mr-1"></i>清空</button>
                    </label>
                    <textarea id="rawInput" class="w-full h-64 p-4 rounded-xl border border-slate-200 font-mono text-sm bg-slate-50 focus:bg-white focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all outline-none resize-none" placeholder="在此输入需要编码的常规文本，或者需要解码的 Base64 文本..."></textarea>
                </div>
                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-700 mb-2 flex items-center justify-between">
                        <span>转换结果</span>
                        <button onclick="copyOutput()" class="text-xs font-normal text-violet-600 hover:text-violet-800"><i class="fa-solid fa-copy mr-1"></i>复制结果</button>
                    </label>
                    <textarea id="resultOutput" readonly class="w-full h-64 p-4 rounded-xl border border-slate-200 font-mono text-sm bg-slate-50/50 outline-none resize-none text-slate-600 select-all" placeholder="转换结果将在此处实时呈现..."></textarea>
                </div>
            </div>

            <div class="mt-6 flex justify-end gap-3 border-t border-slate-100 pt-6">
                <button onclick="processBase64('decode')" class="px-5 py-2.5 border border-slate-200 hover:bg-slate-50 text-slate-700 text-sm font-medium rounded-xl transition-colors">
                    <i class="fa-solid fa-unlock-keyhole mr-2 text-slate-500"></i>Base64 解码 (Decode)
                </button>
                <button onclick="processBase64('encode')" class="px-6 py-2.5 aurora-bg text-white text-sm font-semibold rounded-xl shadow-md shadow-violet-500/10 hover:opacity-95 transition-all transform active:scale-98">
                    <i class="fa-solid fa-lock mr-2"></i>Base64 编码 (Encode)
                </button>
            </div>
        </div>

        <div id="imageSection" class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 hidden">
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="flex flex-col justify-between">
                    <div>
                        <label class="text-sm font-semibold text-slate-700 mb-2 block">上传或拖拽图片</label>
                        <div id="dropZone" class="border-2 border-dashed border-slate-200 hover:border-violet-400 bg-slate-50/50 rounded-2xl p-8 flex flex-col items-center justify-center cursor-pointer transition-all min-h-[200px]">
                            <i class="fa-solid fa-cloud-arrow-up text-3xl text-slate-300 mb-3"></i>
                            <p class="text-sm text-slate-600 font-medium">点击上传图片 或将图片拖拽到这里</p>
                            <p class="text-xs text-slate-400 mt-1">支持 PNG, JPG, JPEG, WEBP, GIF</p>
                            <input type="file" id="fileInput" accept="image/*" class="hidden">
                        </div>
                    </div>
                    <div id="previewContainer" class="mt-4 p-4 border border-slate-100 rounded-xl bg-slate-50 flex items-center gap-4 hidden">
                        <img id="imgPreview" class="w-20 h-20 object-cover rounded-lg border border-slate-200 bg-white">
                        <div class="flex-1 min-w-0">
                            <p id="imgName" class="text-sm font-medium text-slate-700 truncate"></p>
                            <p id="imgSize" class="text-xs text-slate-400 mt-0.5"></p>
                        </div>
                    </div>
                </div>

                <div class="flex flex-col">
                    <label class="text-sm font-semibold text-slate-700 mb-2 flex items-center justify-between">
                        <span>生成的 Image Base64 Data URI</span>
                        <button onclick="clearAll('imageOutput')" class="text-xs font-normal text-slate-400 hover:text-slate-600"><i class="fa-solid fa-trash-can mr-1"></i>清空</button>
                    </label>
                    <textarea id="imageOutput" class="w-full h-64 p-4 rounded-xl border border-slate-200 font-mono text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all outline-none resize-none text-slate-500" placeholder="图片 Base64 字符串将在此处生成..."></textarea>
                    <div class="mt-3 flex gap-2">
                        <button onclick="copyImgBase64(false)" class="flex-1 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-semibold rounded-lg transition-colors">
                            <i class="fa-solid fa-code mr-1.5"></i>仅复制 Base64 字符
                        </button>
                        <button onclick="copyImgBase64(true)" class="flex-1 py-2 bg-violet-50 hover:bg-violet-100 text-violet-700 text-xs font-semibold rounded-lg transition-colors">
                            <i class="fa-solid fa-paste mr-1.5"></i>复制 Data URI (可做斜杠引入)
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        // 标签切换
        function switchTab(tab) {
            const textTab = document.getElementById('tab-text');
            const imgTab = document.getElementById('tab-image');
            const textSection = document.getElementById('textSection');
            const imgSection = document.getElementById('imageSection');

            if (tab === 'text') {
                textTab.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all shadow-sm bg-white text-slate-800";
                imgTab.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-800";
                textSection.classList.remove('hidden');
                imgSection.classList.add('hidden');
            } else {
                imgTab.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all shadow-sm bg-white text-slate-800";
                textTab.className = "px-5 py-2 rounded-lg text-sm font-semibold transition-all text-slate-600 hover:text-slate-800";
                imgSection.classList.remove('hidden');
                textSection.classList.add('hidden');
            }
        }

        // 纯文本编解码核心逻辑
        function processBase64(action) {
            const input = document.getElementById('rawInput').value.trim();
            const outputArea = document.getElementById('resultOutput');
            if (!input) return alert('请输入需要处理的文本！');

            try {
                if (action === 'encode') {
                    // 使用 UTF-8 安全编码，支持中文环境
                    outputArea.value = btoa(encodeURIComponent(input).replace(/%([0-9A-F]{2})/g, function(match, p1) {
                        return String.fromCharCode('0x' + p1);
                    }));
                } else {
                    // 解码安全还原
                    outputArea.value = decodeURIComponent(atob(input).split('').map(function(c) {
                        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                    }).join(''));
                }
            } catch (e) {
                alert('转换失败：请输入标准的常规字符串或合法的 Base64 编码！');
                outputArea.value = '';
            }
        }

        // 图片转 Base64 交互逻辑
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        dropZone.addEventListener('click', () => fileInput.click());
        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-violet-500', 'bg-violet-50/20'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('border-violet-500', 'bg-violet-50/20'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('border-violet-500', 'bg-violet-50/20');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        function handleFile(file) {
            if (!file.type.startsWith('image/')) return alert('请上传合法的图片格式文件！');
            
            document.getElementById('imgName').innerText = file.name;
            document.getElementById('imgSize').innerText = (file.size / 1024).toFixed(1) + ' KB';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('imgPreview').src = e.target.result;
                document.getElementById('imageOutput').value = e.target.result;
                document.getElementById('previewContainer').classList.remove('hidden');
            }
            reader.読み = reader.readAsDataURL(file);
        }

        // 全局通用工具函数
        function clearAll(id) {
            document.getElementById(id).value = '';
            if (id === 'imageOutput') document.getElementById('previewContainer').classList.add('hidden');
        }

        function copyOutput() {
            const text = document.getElementById('resultOutput').value;
            if(!text) return;
            navigator.clipboard.writeText(text).then(() => alert('结果已成功复制到剪贴板！'));
        }

        function copyImgBase64(includeHeader) {
            let text = document.getElementById('imageOutput').value;
            if(!text) return alert('请先上传图片生成 Base64！');
            if (!includeHeader) {
                text = text.replace(/^data:image\/\w+;base64,/, "");
            }
            navigator.clipboard.writeText(text).then(() => alert('图片 Base64 数据复制成功！'));
        }

        // 统一组件挂载联动
        document.addEventListener('DOMContentLoaded', () => {
            if (window.parent && window.parent.integrateToolPage) {
                window.parent.integrateToolPage('format-base64');
            }
        });
    </script>
</body>
</html>
