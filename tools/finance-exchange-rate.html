<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球货币极速换算器 - Dev Toolbox</title>
<meta name="description" content="在线全球货币换算工具，纯前端免 API，内置 USD/CNY/EUR/JPY/HKD/GBP 基准汇率，联动实时换算。">
<link rel="icon" href="../favicon.ico">
<style>
  :root{--bg:#0f1117;--bg2:#1a1d27;--bg3:#22263a;--border:#2e3347;--text:#e2e8f0;--text2:#94a3b8;--text3:#64748b;--accent:#3b82f6;--accent-hover:#2563eb;--success:#22c55e;--success-bg:rgba(34,197,94,.15);--success-text:#86efac;--warning:#f59e0b;--warning-bg:rgba(245,158,11,.15);--warning-text:#fde68a;--radius:12px;--shadow:0 4px 24px rgba(0,0,0,.4);--usd:#22c55e;--cny:#ef4444;--eur:#3b82f6;--jpy:#f59e0b;--hkd:#a855f7;--gbp:#ec4899}
  [data-theme="light"]{--bg:#f8fafc;--bg2:#fff;--bg3:#f1f5f9;--border:#e2e8f0;--text:#1e293b;--text2:#475569;--text3:#94a3b8;--shadow:0 4px 24px rgba(0,0,0,.08);--success-bg:rgba(34,197,94,.1);--success-text:#166534;--warning-bg:rgba(245,158,11,.1);--warning-text:#92400e}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding-bottom:60px}
  .page-header{position:relative;background:var(--bg2);border-bottom:1px solid var(--border);overflow:hidden;padding:28px 24px 20px}
  .page-header::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 80% at 20% 50%,rgba(59,130,246,.12) 0%,transparent 70%),radial-gradient(ellipse 40% 60% at 80% 30%,rgba(99,102,241,.08) 0%,transparent 70%);pointer-events:none}
  .header-inner{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:16px;position:relative}
  .back-btn{display:flex;align-items:center;gap:6px;color:var(--text2);text-decoration:none;font-size:13px;padding:6px 12px;border-radius:8px;border:1px solid var(--border);background:var(--bg3);transition:all .2s;white-space:nowrap}
  .back-btn:hover{color:var(--text);border-color:var(--accent)}
  .header-title{flex:1}
  .header-title h1{font-size:20px;font-weight:700;line-height:1.3}
  .header-title p{font-size:13px;color:var(--text2);margin-top:3px}
  .fav-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;transition:all .2s}
  .fav-btn:hover{border-color:var(--accent)}
  .fav-btn.active{color:#fbbf24;border-color:#fbbf24;background:rgba(251,191,36,.1)}
  .theme-btn{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
  .theme-btn:hover{border-color:var(--accent);color:var(--accent)}
  .main{max-width:900px;margin:0 auto;padding:20px 16px}
  .rate-note{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:20px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:8px}
  .rate-note .dot{width:8px;height:8px;border-radius:50%;background:var(--success);flex-shrink:0}
  .currency-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  @media(max-width:600px){.currency-grid{grid-template-columns:1fr}}
  .currency-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:border-color .2s}
  .currency-card:focus-within{border-color:var(--accent)}
  .currency-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;border-bottom:1px solid var(--border);background:var(--bg3)}
  .currency-name{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
  .currency-flag{font-size:20px}
  .currency-code{font-size:12px;color:var(--text3);font-weight:500}
  .currency-body{padding:12px 16px}
  .currency-input{width:100%;padding:12px 0;font-size:22px;font-weight:700;background:transparent;border:none;outline:none;color:var(--text);font-family:'JetBrains Mono','Fira Code',monospace}
  .currency-input::placeholder{color:var(--text3);font-weight:400}
  .currency-rate{font-size:11px;color:var(--text3);margin-top:6px}
  .rate-bar{display:flex;align-items:center;gap:8px;margin-top:4px;height:3px;border-radius:2px;background:var(--bg3);overflow:hidden}
  .rate-fill{height:100%;border-radius:2px;transition:width .3s}
  .custom-panel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:20px}
  .custom-toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;cursor:pointer;background:var(--bg3);transition:all .2s;user-select:none}
  .custom-toggle:hover{background:var(--bg2)}
  .custom-toggle-label{font-size:13px;font-weight:600;color:var(--text2);display:flex;align-items:center;gap:8px}
  .custom-arrow{transition:transform .2s;font-size:12px;color:var(--text3)}
  .custom-arrow.open{transform:rotate(180deg)}
  .custom-body{display:none;padding:16px}
  .custom-body.open{display:block}
  .rate-table{width:100%;border-collapse:collapse;font-size:13px}
  .rate-table th{padding:8px 12px;text-align:left;font-weight:600;color:var(--text2);border-bottom:1px solid var(--border);background:var(--bg3)}
  .rate-table td{padding:8px 12px;border-bottom:1px solid var(--border)}
  .rate-table tr:last-child td{border-bottom:none}
  .rate-input{width:80px;padding:6px 8px;font-size:13px;background:var(--bg3);border:1px solid var(--border);border-radius:4px;color:var(--text);outline:none;text-align:right;font-family:'JetBrains Mono','Fira Code',monospace}
  .rate-input:focus{border-color:var(--accent)}
  .reset-btn{padding:6px 14px;font-size:12px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text2);cursor:pointer;transition:all .2s;margin-top:12px}
  .reset-btn:hover{border-color:var(--accent);color:var(--accent)}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--text);box-shadow:var(--shadow);transform:translateY(80px);opacity:0;transition:all .3s;z-index:9999}
  .toast.show{transform:translateY(0);opacity:1}
</style>
</head>
<body>
<header class="page-header">
  <div class="header-inner">
    <a href="../index.html" class="back-btn">← 返回首页</a>
    <div class="header-title"><h1>全球货币极速换算器</h1><p>免 API · 6 大核心货币联动换算 · 可自定义汇率</p></div>
    <button class="fav-btn" id="favBtn" title="收藏此工具">☆</button>
    <button class="theme-btn" id="themeBtn" title="切换主题">☀️</button>
  </div>
</header>
<div class="main">
  <div class="rate-note"><span class="dot"></span><span>基准汇率基于 USD，数据为参考值，手动修改后自动保存至本地</span></div>
  <div class="currency-grid" id="currencyGrid"></div>
  <div class="custom-panel">
    <div class="custom-toggle" id="customToggle">
      <span class="custom-toggle-label">⚙️ 手动修改基准汇率</span>
      <span class="custom-arrow" id="customArrow">▼</span>
    </div>
    <div class="custom-body" id="customBody">
      <table class="rate-table">
        <thead><tr><th>货币</th><th>1 USD =</th><th>相对 CNY</th></tr></thead>
        <tbody id="rateTableBody"></tbody>
      </table>
      <button class="reset-btn" id="resetBtn">恢复默认汇率</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(function(){
  'use strict';
  const savedTheme=localStorage.getItem('toolbox_theme')||'dark';
  document.documentElement.dataset.theme=savedTheme;
  const themeBtn=document.getElementById('themeBtn');
  themeBtn.textContent=savedTheme==='dark'?'☀️':'🌙';
  themeBtn.addEventListener('click',()=>{const t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('toolbox_theme',t);themeBtn.textContent=t==='dark'?'☀️':'🌙'});

  const FAV_KEY='toolbox_favorites_v2',TOOL_ID='finance-exchange-rate';
  function getFavs(){try{return JSON.parse(localStorage.getItem(FAV_KEY))||[]}catch{return[]}}
  function setFavs(a){localStorage.setItem(FAV_KEY,JSON.stringify(a))}
  const favBtn=document.getElementById('favBtn'),favs=getFavs();
  if(favs.includes(TOOL_ID)){favBtn.classList.add('active');favBtn.textContent='★'}
  favBtn.addEventListener('click',()=>{const a=getFavs();if(a.includes(TOOL_ID)){setFavs(a.filter(x=>x!==TOOL_ID));favBtn.classList.remove('active');favBtn.textContent='☆'}else{setFavs([TOOL_ID,...a.filter(x=>x!==TOOL_ID)]);favBtn.classList.add('active');favBtn.textContent='★'}});

  const DEFAULT_RATES={USD:1,CNY:7.25,EUR:0.92,JPY:157.5,HKD:7.82,GBP:0.79};
  const CURRENCY_INFO={
    USD:{name:'美元',flag:'🇺🇸',color:'var(--usd)'},
    CNY:{name:'人民币',flag:'🇨🇳',color:'var(--cny)'},
    EUR:{name:'欧元',flag:'🇪🇺',color:'var(--eur)'},
    JPY:{name:'日元',flag:'🇯🇵',color:'var(--jpy)'},
    HKD:{name:'港币',flag:'🇭🇰',color:'var(--hkd)'},
    GBP:{name:'英镑',flag:'🇬🇧',color:'var(--gbp)'}
  };

  const STORE_KEY='toolbox_exchange_rates_v1';
  let rates;
  try{rates=JSON.parse(localStorage.getItem(STORE_KEY));if(!rates||!rates.USD)rates=null}catch{rates=null}
  if(!rates)rates=Object.assign({},DEFAULT_RATES);

  function saveRates(){localStorage.setItem(STORE_KEY,JSON.stringify(rates))}

  function buildGrid(){
    const grid=document.getElementById('currencyGrid');
    grid.innerHTML='';
    const keys=Object.keys(CURRENCY_INFO);
    keys.forEach(code=>{
      const info=CURRENCY_INFO[code];
      const card=document.createElement('div');
      card.className='currency-card';
      card.innerHTML=`<div class="currency-header"><div class="currency-name"><span class="currency-flag">${info.flag}</span>${info.name}</div><div class="currency-code">${code}</div></div><div class="currency-body"><input type="number" class="currency-input" id="input_${code}" placeholder="0.00" step="any"><div class="currency-rate">1 USD = ${rates[code].toFixed(4)} ${code}</div><div class="rate-bar"><div class="rate-fill" style="width:${Math.min(rates[code]/157.5*100,100).toFixed(1)}%;background:${info.color}"></div></div></div>`;
      grid.appendChild(card);
    });

    keys.forEach(code=>{
      const input=document.getElementById('input_'+code);
      input.addEventListener('input',()=>{convert(code)});
      input.addEventListener('focus',()=>{input.select()});
    });
  }

  function convert(sourceCode){
    const sourceInput=document.getElementById('input_'+sourceCode);
    const val=parseFloat(sourceInput.value);
    if(isNaN(val)||val===0){
      Object.keys(CURRENCY_INFO).forEach(code=>{
        if(code!==sourceCode)document.getElementById('input_'+code).value='';
      });
      return;
    }
    const usdAmount=val/rates[sourceCode];
    Object.keys(CURRENCY_INFO).forEach(code=>{
      if(code!==sourceCode){
        const converted=usdAmount*rates[code];
        const el=document.getElementById('input_'+code);
        if(code==='JPY'){
          el.value=Math.round(converted);
        }else{
          el.value=converted.toFixed(2);
        }
      }
    });
  }

  function buildRateTable(){
    const tbody=document.getElementById('rateTableBody');
    tbody.innerHTML='';
    Object.keys(CURRENCY_INFO).forEach(code=>{
      if(code==='USD')return;
      const info=CURRENCY_INFO[code];
      const relCNY=(rates[code]/rates.CNY).toFixed(4);
      tbody.innerHTML+=`<tr><td>${info.flag} ${info.name} (${code})</td><td><input class="rate-input" data-code="${code}" value="${rates[code].toFixed(4)}"></td><td>${relCNY}</td></tr>`;
    });
    tbody.querySelectorAll('.rate-input').forEach(inp=>{
      inp.addEventListener('change',()=>{
        const code=inp.dataset.code;
        const val=parseFloat(inp.value);
        if(!isNaN(val)&&val>0){
          rates[code]=val;
          saveRates();
          buildGrid();
          buildRateTable();
          const firstInput=document.getElementById('input_USD');
          if(firstInput.value)convert('USD');
          toast('汇率已更新');
        }
      });
    });
  }

  document.getElementById('customToggle').addEventListener('click',()=>{
    const body=document.getElementById('customBody');
    const arrow=document.getElementById('customArrow');
    body.classList.toggle('open');
    arrow.classList.toggle('open');
  });

  document.getElementById('resetBtn').addEventListener('click',()=>{
    rates=Object.assign({},DEFAULT_RATES);
    saveRates();
    buildGrid();
    buildRateTable();
    const firstInput=document.getElementById('input_USD');
    if(firstInput.value)convert('USD');
    toast('已恢复默认汇率');
  });

  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

  buildGrid();
  buildRateTable();
})();
</script>
</body>
</html>
