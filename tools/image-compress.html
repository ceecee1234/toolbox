<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片压缩工具 - 纯前端Canvas图片压缩 | 全能工具箱</title>
    <meta name="description" content="免费在线图片压缩工具，纯前端Canvas实现，不上传服务器，滑块调节质量，实时对比压缩前后体积，隐私安全。">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
    <style>
        :root{--bg:#f8fafc;--bg2:#f1f5f9;--card:#fff;--text:#1e293b;--text2:#64748b;--text3:#94a3b8;--primary:#4F46E5;--primary-light:#EEF2FF;--success:#10B981;--warning:#F59E0B;--error:#EF4444;--border:#e2e8f0;--radius:12px}
        .dark{--bg:#0f172a;--bg2:#1e293b;--card:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--border:#334155;--primary-light:rgba(79,70,229,.2)}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;min-height:100vh}
        a{color:inherit;text-decoration:none}
        .header{position:sticky;top:0;z-index:100;background:var(--card);border-bottom:1px solid var(--border)}
        .header-inner{max-width:900px;margin:0 auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:18px;font-weight:700;display:flex;align-items:center;gap:6px}
        .icon-btn{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-size:16px;background:none;border:1px solid var(--border);border-radius:10px;cursor:pointer;transition:.2s}
        .icon-btn:hover{background:var(--bg2)}
        .main{max-width:900px;margin:0 auto;padding:24px 20px}
        .breadcrumb{display:flex;gap:8px;font-size:13px;color:var(--text3);margin-bottom:20px;flex-wrap:wrap}
        .breadcrumb a{color:var(--primary)}
        .tool-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:10px}
        .tool-title{font-size:26px;font-weight:700;display:flex;align-items:center;gap:10px}
        .tool-desc{color:var(--text2);margin-bottom:24px;font-size:15px}
        .tool-fav-btn{padding:8px 18px;font-size:14px;background:var(--card);border:1px solid var(--border);border-radius:50px;cursor:pointer;transition:.2s;color:var(--text2)}
        .tool-fav-btn:hover,.tool-fav-btn.active{color:var(--warning);border-color:var(--warning)}

        /* 上传区 */
        .upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:48px 20px;text-align:center;cursor:pointer;transition:.25s;position:relative;background:var(--card)}
        .upload-zone:hover,.upload-zone.drag-over{border-color:var(--primary);background:var(--primary-light)}
        .upload-zone input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
        .upload-icon{font-size:56px;margin-bottom:16px}
        .upload-title{font-size:18px;font-weight:600;margin-bottom:8px}
        .upload-hint{font-size:14px;color:var(--text2)}
        .upload-types{display:flex;justify-content:center;gap:8px;margin-top:12px;flex-wrap:wrap}
        .upload-type-tag{padding:4px 12px;font-size:12px;background:var(--bg2);border:1px solid var(--border);border-radius:20px;color:var(--text3)}

        /* 工具区 */
        .tool-workspace{display:none;margin-top:24px}
        .tool-workspace.show{display:block}

        /* 控制面板 */
        .controls-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
        .controls-title{font-size:15px;font-weight:600;margin-bottom:20px}
        .control-row{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
        .control-label{font-size:14px;font-weight:600;min-width:90px;color:var(--text2)}
        .quality-slider{flex:1;min-width:160px;height:8px;-webkit-appearance:none;appearance:none;background:var(--border);border-radius:4px;outline:none;cursor:pointer}
        .quality-slider::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;background:var(--primary);border-radius:50%;cursor:pointer;box-shadow:0 2px 6px rgba(79,70,229,.4)}
        .quality-value{font-size:18px;font-weight:700;color:var(--primary);min-width:50px;text-align:center}
        .format-tabs{display:flex;gap:8px;flex-wrap:wrap}
        .fmt-btn{padding:8px 18px;font-size:13px;font-weight:600;background:var(--bg2);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:.2s;color:var(--text2)}
        .fmt-btn.active{background:var(--primary);border-color:var(--primary);color:white}
        .max-width-input{width:100px;height:40px;padding:0 12px;font-size:14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;color:var(--text);outline:none}
        .max-width-input:focus{border-color:var(--primary)}

        /* 对比区 */
        .compare-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
        .compare-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
        .compare-header{padding:12px 16px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
        .compare-label{font-size:13px;font-weight:600;color:var(--text2)}
        .compare-size{font-size:13px;font-weight:700;color:var(--text)}
        .compare-img-wrap{padding:12px;background:var(--bg2);min-height:200px;display:flex;align-items:center;justify-content:center}
        .compare-img-wrap img{max-width:100%;max-height:280px;border-radius:8px;display:block}
        .compare-info{padding:12px 16px;font-size:12px;color:var(--text3)}

        /* 节省指示 */
        .saving-banner{background:linear-gradient(135deg,var(--success),#059669);color:white;border-radius:var(--radius);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px;display:none}
        .saving-banner.show{display:flex}
        .saving-stat{text-align:center}
        .saving-val{font-size:28px;font-weight:700}
        .saving-lbl{font-size:12px;opacity:.9}

        /* 动作区 */
        .actions{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
        .action-btn{padding:12px 28px;font-size:15px;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:8px}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{filter:brightness(1.1);transform:translateY(-2px)}
        .btn-success{background:var(--success);color:white}
        .btn-success:hover{filter:brightness(1.1)}
        .btn-secondary{background:var(--bg2);color:var(--text);border:1px solid var(--border)}
        .btn-secondary:hover{border-color:var(--primary)}
        .btn-secondary:disabled{opacity:.4;cursor:not-allowed}

        /* 批量列表 */
        .batch-list{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;margin-bottom:20px;display:none}
        .batch-list.show{display:block}
        .batch-list-header{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600;display:flex;justify-content:space-between}
        .batch-item{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--border);font-size:13px;transition:.2s}
        .batch-item:last-child{border-bottom:none}
        .batch-item:hover{background:var(--bg2)}
        .batch-thumb{width:40px;height:40px;object-fit:cover;border-radius:6px}
        .batch-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
        .batch-sizes{text-align:right;color:var(--text2);min-width:130px}
        .batch-saving{padding:3px 10px;background:rgba(16,185,129,.15);color:var(--success);border-radius:20px;font-size:12px;font-weight:700}
        .batch-dl{padding:6px 14px;font-size:12px;font-weight:600;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer}

        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(80px);padding:12px 24px;background:var(--text);color:#fff;border-radius:50px;opacity:0;transition:.3s;z-index:1000;font-size:14px}
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
        .toast.success{background:var(--success)}
        .toast.error{background:var(--error)}
        .footer{margin-top:60px;padding:24px 20px;border-top:1px solid var(--border);text-align:center;color:var(--text3);font-size:13px}
        .footer a{color:var(--primary)}

        @media(max-width:600px){
            .compare-grid{grid-template-columns:1fr}
            .saving-banner{flex-direction:column;text-align:center}
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="../" class="logo">🛠️ 全能工具箱</a>
            <button class="icon-btn" onclick="toggleTheme()">🌓</button>
        </div>
    </header>

    <main class="main">
        <nav class="breadcrumb">
            <a href="../">首页</a><span>›</span>
            <span>图片工具</span><span>›</span>
            <span>图片压缩</span>
        </nav>

        <div class="tool-header">
            <h1 class="tool-title">🗜️ 图片压缩工具</h1>
            <button class="tool-fav-btn" data-tool-id="image-compress">☆ 收藏</button>
        </div>
        <p class="tool-desc">纯前端 Canvas 压缩，文件不上传服务器，隐私安全。支持 JPG/PNG/WebP，拖拽上传，批量处理。</p>

        <!-- 上传区 -->
        <div class="upload-zone" id="uploadZone">
            <input type="file" id="fileInput" accept="image/*" multiple onchange="handleFiles(this.files)">
            <div class="upload-icon">🖼️</div>
            <div class="upload-title">点击选择图片 或 拖拽到这里</div>
            <div class="upload-hint">支持批量上传，文件留在本地不会上传到服务器</div>
            <div class="upload-types">
                <span class="upload-type-tag">JPEG</span>
                <span class="upload-type-tag">PNG</span>
                <span class="upload-type-tag">WebP</span>
                <span class="upload-type-tag">GIF(静态)</span>
            </div>
        </div>

        <!-- 工具区（上传后显示） -->
        <div class="tool-workspace" id="workspace">

            <!-- 控制面板 -->
            <div class="controls-card">
                <div class="controls-title">⚙️ 压缩设置</div>

                <div class="control-row">
                    <span class="control-label">输出质量</span>
                    <input type="range" class="quality-slider" id="qualitySlider" min="1" max="100" value="80" oninput="onQualityChange()">
                    <span class="quality-value" id="qualityVal">80%</span>
                </div>

                <div class="control-row">
                    <span class="control-label">输出格式</span>
                    <div class="format-tabs">
                        <button class="fmt-btn active" data-fmt="image/jpeg" onclick="setFormat(this)">JPEG</button>
                        <button class="fmt-btn" data-fmt="image/png" onclick="setFormat(this)">PNG</button>
                        <button class="fmt-btn" data-fmt="image/webp" onclick="setFormat(this)">WebP</button>
                    </div>
                </div>

                <div class="control-row">
                    <span class="control-label">最大宽度</span>
                    <input type="number" class="max-width-input" id="maxWidthInput" value="1920" min="100" max="8000" placeholder="像素">
                    <span style="font-size:13px;color:var(--text3)">px（0或空=不限制）</span>
                </div>

                <div class="actions" style="margin-bottom:0;margin-top:4px">
                    <button class="action-btn btn-primary" onclick="compressAll()">✨ 开始压缩</button>
                    <button class="action-btn btn-secondary" onclick="resetAll()">🔄 重新选择</button>
                </div>
            </div>

            <!-- 节省展示 -->
            <div class="saving-banner" id="savingBanner">
                <div class="saving-stat">
                    <div class="saving-val" id="sv-original">--</div>
                    <div class="saving-lbl">原始大小</div>
                </div>
                <div style="font-size:32px">→</div>
                <div class="saving-stat">
                    <div class="saving-val" id="sv-compressed">--</div>
                    <div class="saving-lbl">压缩后大小</div>
                </div>
                <div class="saving-stat">
                    <div class="saving-val" id="sv-ratio">--</div>
                    <div class="saving-lbl">节省比例</div>
                </div>
            </div>

            <!-- 单图对比（单个文件时显示） -->
            <div class="compare-grid" id="compareSingle" style="display:none">
                <div class="compare-panel">
                    <div class="compare-header">
                        <span class="compare-label">📂 原图</span>
                        <span class="compare-size" id="orig-size">--</span>
                    </div>
                    <div class="compare-img-wrap">
                        <img id="orig-preview" src="" alt="原图" style="display:none">
                    </div>
                    <div class="compare-info" id="orig-info">--</div>
                </div>
                <div class="compare-panel">
                    <div class="compare-header">
                        <span class="compare-label">✅ 压缩后</span>
                        <span class="compare-size" id="comp-size">--</span>
                    </div>
                    <div class="compare-img-wrap">
                        <img id="comp-preview" src="" alt="压缩后" style="display:none">
                    </div>
                    <div class="compare-info" id="comp-info">等待压缩...</div>
                </div>
            </div>

            <!-- 批量列表 -->
            <div class="batch-list" id="batchList">
                <div class="batch-list-header">
                    <span id="batch-title">文件列表</span>
                    <button class="action-btn btn-success" style="padding:6px 16px;font-size:13px" onclick="downloadAll()">📦 全部下载</button>
                </div>
                <div id="batchItems"></div>
            </div>

        </div>
    </main>

    <footer class="footer">
        <p>© 2025 全能工具箱 | <a href="../">返回首页</a></p>
    </footer>
    <div id="toast" class="toast"></div>

    <script src="../js/tools-data.js"></script>
    <script src="../js/toolbox-core.js"></script>
    <script>
        var files = [];
        var results = [];
        var outputFormat = 'image/jpeg';

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light');
        }

        // ---- 拖拽支持 ----
        var zone = document.getElementById('uploadZone');
        zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('drag-over'); });
        zone.addEventListener('dragleave', function() { zone.classList.remove('drag-over'); });
        zone.addEventListener('drop', function(e) {
            e.preventDefault();
            zone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        function handleFiles(fl) {
            if (!fl || !fl.length) return;
            files = Array.from(fl).filter(function(f) { return f.type.startsWith('image/'); });
            if (!files.length) { showToast('请选择图片文件', 'error'); return; }
            results = new Array(files.length).fill(null);
            showWorkspace();
        }

        function showWorkspace() {
            document.getElementById('workspace').classList.add('show');
            document.getElementById('uploadZone').style.display = 'none';

            if (files.length === 1) {
                document.getElementById('compareSingle').style.display = 'grid';
                document.getElementById('batchList').classList.remove('show');
                showOrigPreview(files[0]);
            } else {
                document.getElementById('compareSingle').style.display = 'none';
                document.getElementById('batchList').classList.add('show');
                document.getElementById('batch-title').textContent = '文件列表（共' + files.length + '个）';
                renderBatchList();
            }
        }

        function showOrigPreview(file) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = document.getElementById('orig-preview');
                img.src = e.target.result;
                img.style.display = 'block';
                document.getElementById('orig-size').textContent = formatSize(file.size);
                document.getElementById('orig-info').textContent = file.name + ' · ' + file.type.split('/')[1].toUpperCase();
            };
            reader.readAsDataURL(file);
        }

        function renderBatchList() {
            var html = files.map(function(f, i) {
                return '<div class="batch-item" id="bi-' + i + '">' +
                    '<img class="batch-thumb" id="bt-' + i + '" src="" alt="">' +
                    '<span class="batch-name">' + f.name + '</span>' +
                    '<span class="batch-sizes" id="bs-' + i + '">' + formatSize(f.size) + ' → 待压缩</span>' +
                    '<button class="batch-dl" id="bdl-' + i + '" onclick="downloadOne(' + i + ')" disabled>下载</button>' +
                    '</div>';
            }).join('');
            document.getElementById('batchItems').innerHTML = html;

            files.forEach(function(f, i) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var t = document.getElementById('bt-' + i);
                    if (t) t.src = e.target.result;
                };
                reader.readAsDataURL(f);
            });
        }

        function onQualityChange() {
            document.getElementById('qualityVal').textContent = document.getElementById('qualitySlider').value + '%';
        }

        function setFormat(btn) {
            document.querySelectorAll('.fmt-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            outputFormat = btn.dataset.fmt;
        }

        function compressAll() {
            if (!files.length) return;
            var quality = parseInt(document.getElementById('qualitySlider').value) / 100;
            var maxW = parseInt(document.getElementById('maxWidthInput').value) || 0;

            var total = files.length;
            var done = 0;

            files.forEach(function(file, i) {
                compressImage(file, quality, maxW, outputFormat, function(blob, dataUrl) {
                    results[i] = { blob: blob, dataUrl: dataUrl, origSize: file.size, compSize: blob.size, name: file.name };
                    done++;
                    updateUI(i, results[i]);
                    if (done === total) showSummary();
                });
            });
        }

        function compressImage(file, quality, maxW, fmt, cb) {
            var reader = new FileReader();
            reader.onload = function(e) {
                var img = new Image();
                img.onload = function() {
                    var w = img.naturalWidth;
                    var h = img.naturalHeight;
                    if (maxW > 0 && w > maxW) {
                        h = Math.round(h * maxW / w);
                        w = maxW;
                    }
                    var canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    var ctx = canvas.getContext('2d');
                    if (fmt === 'image/png') {
                        ctx.clearRect(0, 0, w, h);
                    } else {
                        ctx.fillStyle = '#fff';
                        ctx.fillRect(0, 0, w, h);
                    }
                    ctx.drawImage(img, 0, 0, w, h);
                    canvas.toBlob(function(blob) {
                        var dataUrl = canvas.toDataURL(fmt, quality);
                        cb(blob, dataUrl);
                    }, fmt, quality);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function updateUI(i, result) {
            if (files.length === 1) {
                var img = document.getElementById('comp-preview');
                img.src = result.dataUrl;
                img.style.display = 'block';
                document.getElementById('comp-size').textContent = formatSize(result.compSize);
                var ext = outputFormat.split('/')[1].toUpperCase();
                document.getElementById('comp-info').textContent = result.name + ' → ' + ext + ' · ' + formatSize(result.compSize);
            } else {
                var sizeEl = document.getElementById('bs-' + i);
                var dlEl = document.getElementById('bdl-' + i);
                var pct = ((1 - result.compSize / result.origSize) * 100).toFixed(1);
                if (sizeEl) sizeEl.innerHTML = formatSize(result.origSize) + ' → ' + formatSize(result.compSize) +
                    ' <span class="batch-saving">-' + pct + '%</span>';
                if (dlEl) { dlEl.disabled = false; }
            }
        }

        function showSummary() {
            var origTotal = results.reduce(function(s, r) { return s + r.origSize; }, 0);
            var compTotal = results.reduce(function(s, r) { return s + r.compSize; }, 0);
            var pct = ((1 - compTotal / origTotal) * 100).toFixed(1);

            document.getElementById('sv-original').textContent = formatSize(origTotal);
            document.getElementById('sv-compressed').textContent = formatSize(compTotal);
            document.getElementById('sv-ratio').textContent = '-' + pct + '%';
            document.getElementById('savingBanner').classList.add('show');
            showToast('压缩完成！节省 ' + pct + '%', 'success');
        }

        function downloadOne(i) {
            var r = results[i];
            if (!r) return;
            var ext = outputFormat === 'image/jpeg' ? '.jpg' : outputFormat === 'image/webp' ? '.webp' : '.png';
            var name = r.name.replace(/\.[^.]+$/, '') + '_compressed' + ext;
            var a = document.createElement('a');
            a.href = URL.createObjectURL(r.blob);
            a.download = name;
            a.click();
            setTimeout(function() { URL.revokeObjectURL(a.href); }, 1000);
        }

        function downloadAll() {
            var valid = results.filter(function(r) { return r && r.blob; });
            if (!valid.length) { showToast('请先压缩图片', 'error'); return; }
            results.forEach(function(r, i) { if (r) setTimeout(function() { downloadOne(i); }, i * 300); });
        }

        function resetAll() {
            files = [];
            results = [];
            document.getElementById('workspace').classList.remove('show');
            document.getElementById('uploadZone').style.display = '';
            document.getElementById('fileInput').value = '';
            document.getElementById('savingBanner').classList.remove('show');
            document.getElementById('comp-preview').style.display = 'none';
            document.getElementById('comp-info').textContent = '等待压缩...';
        }

        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
        }

        function showToast(msg, type) {
            var t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast show' + (type ? ' ' + type : '');
            clearTimeout(t._t);
            t._t = setTimeout(function() { t.className = 'toast'; }, 2800);
        }
    </script>
</body>
</html>
