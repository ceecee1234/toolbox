<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>时间戳转换工具 - Unix时间戳在线转换 | 全能工具箱</title>
    <meta name="description" content="免费在线时间戳转换工具，支持Unix时间戳与日期时间互转，秒级毫秒级时间戳转换，程序员必备工具。">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
    <style>
        :root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--text2:#64748b;--primary:#4F46E5;--primary-light:#EEF2FF;--success:#10B981;--border:#e2e8f0;--radius:12px}
        .dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--border:#334155;--primary-light:rgba(79,70,229,0.2)}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
        .header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px}
        .header-inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:18px;font-weight:700;text-decoration:none;color:var(--text)}
        .main{max-width:800px;margin:0 auto;padding:20px}
        .breadcrumb{display:flex;gap:8px;font-size:14px;color:var(--text2);margin-bottom:20px}
        .breadcrumb a{color:var(--primary);text-decoration:none}
        .tool-header h1{font-size:26px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
        .ad-slot{margin:20px 0;padding:15px;background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);text-align:center;color:var(--text2)}
        .current-time{background:linear-gradient(135deg,var(--primary),#7C3AED);color:white;padding:30px;border-radius:var(--radius);text-align:center;margin-bottom:24px}
        .current-time .label{font-size:14px;opacity:0.9;margin-bottom:8px}
        .current-time .value{font-size:36px;font-weight:700;font-family:monospace}
        .current-time .datetime{font-size:16px;margin-top:8px;opacity:0.9}
        .tool-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
        .tool-card h3{font-size:16px;margin-bottom:16px;display:flex;align-items:center;gap:8px}
        .form-group{margin-bottom:16px}
        .form-group label{display:block;font-size:14px;font-weight:600;margin-bottom:8px}
        .form-group input{width:100%;height:48px;padding:0 16px;font-size:16px;background:var(--bg);border:1px solid var(--border);border-radius:10px;color:var(--text);outline:none}
        .form-group input:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
        .btn{padding:12px 24px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all 0.2s}
        .btn-primary{background:var(--primary);color:white}
        .btn-primary:hover{transform:translateY(-2px)}
        .btn-secondary{background:var(--border);color:var(--text)}
        .result-box{margin-top:16px;padding:16px;background:var(--primary-light);border-radius:10px;display:none}
        .result-box.show{display:block}
        .result-box .label{font-size:13px;color:var(--text2);margin-bottom:4px}
        .result-box .value{font-size:18px;font-weight:600;font-family:monospace;word-break:break-all}
        .copy-btn{margin-top:10px;padding:8px 16px;font-size:13px;background:var(--success);color:white;border:none;border-radius:6px;cursor:pointer}
        .footer{margin-top:60px;padding:30px;text-align:center;border-top:1px solid var(--border);color:var(--text2);font-size:14px}
        .footer a{color:var(--primary)}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);padding:14px 28px;background:var(--success);color:white;border-radius:50px;opacity:0;transition:all 0.3s;z-index:1000}
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="../" class="logo">🛠️ 全能工具箱</a>
            <button onclick="document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')" style="background:none;border:none;font-size:20px;cursor:pointer">🌓</button>
        </div>
    </header>

    <main class="main">
        <nav class="breadcrumb">
            <a href="../">首页</a><span>›</span>
            <a href="../#datetime">时间工具</a><span>›</span>
            <span>时间戳转换</span>
        </nav>

        <div class="ad-slot">📢 广告位</div>

        <div class="tool-header">
            <h1><span>⏱️</span> 时间戳转换工具</h1>
        </div>

        <!-- 当前时间戳 -->
        <div class="current-time">
            <div class="label">当前Unix时间戳（秒）</div>
            <div class="value" id="currentTs">--</div>
            <div class="datetime" id="currentDatetime">--</div>
        </div>

        <!-- 时间戳转日期 -->
        <div class="tool-card">
            <h3>🔄 时间戳 → 日期时间</h3>
            <div class="form-group">
                <label>输入时间戳</label>
                <input type="text" id="tsInput" placeholder="输入10位或13位时间戳">
            </div>
            <button class="btn btn-primary" onclick="tsToDate()">转换</button>
            <button class="btn btn-secondary" onclick="pasteNow()" style="margin-left:10px">粘贴当前</button>
            <div class="result-box" id="tsResult">
                <div class="label">转换结果</div>
                <div class="value" id="tsResultValue">--</div>
                <button class="copy-btn" onclick="copyText(document.getElementById('tsResultValue').textContent)">复制</button>
            </div>
        </div>

        <!-- 日期转时间戳 -->
        <div class="tool-card">
            <h3>🔄 日期时间 → 时间戳</h3>
            <div class="form-group">
                <label>选择日期时间</label>
                <input type="datetime-local" id="dateInput">
            </div>
            <button class="btn btn-primary" onclick="dateToTs()">转换</button>
            <button class="btn btn-secondary" onclick="setNowDate()" style="margin-left:10px">设为当前</button>
            <div class="result-box" id="dateResult">
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                    <div>
                        <div class="label">秒级时间戳（10位）</div>
                        <div class="value" id="tsSeconds">--</div>
                        <button class="copy-btn" onclick="copyText(document.getElementById('tsSeconds').textContent)">复制</button>
                    </div>
                    <div>
                        <div class="label">毫秒级时间戳（13位）</div>
                        <div class="value" id="tsMillis">--</div>
                        <button class="copy-btn" onclick="copyText(document.getElementById('tsMillis').textContent)">复制</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="ad-slot">📢 广告位</div>

        <!-- 常用时间戳 -->
        <div class="tool-card">
            <h3>📋 常用时间戳参考</h3>
            <table style="width:100%;border-collapse:collapse;font-size:14px">
                <tr style="background:var(--bg)">
                    <th style="padding:12px;text-align:left;border:1px solid var(--border)">时间</th>
                    <th style="padding:12px;text-align:left;border:1px solid var(--border)">时间戳（秒）</th>
                </tr>
                <tr>
                    <td style="padding:12px;border:1px solid var(--border)">今天 00:00:00</td>
                    <td style="padding:12px;border:1px solid var(--border);font-family:monospace" id="todayStart">--</td>
                </tr>
                <tr>
                    <td style="padding:12px;border:1px solid var(--border)">今天 23:59:59</td>
                    <td style="padding:12px;border:1px solid var(--border);font-family:monospace" id="todayEnd">--</td>
                </tr>
                <tr>
                    <td style="padding:12px;border:1px solid var(--border)">本周一 00:00:00</td>
                    <td style="padding:12px;border:1px solid var(--border);font-family:monospace" id="weekStart">--</td>
                </tr>
                <tr>
                    <td style="padding:12px;border:1px solid var(--border)">本月1日 00:00:00</td>
                    <td style="padding:12px;border:1px solid var(--border);font-family:monospace" id="monthStart">--</td>
                </tr>
            </table>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 全能工具箱 | <a href="../">返回首页</a></p>
    </footer>

    <div id="toast" class="toast"></div>

    <script>
        // 更新当前时间戳
        function updateCurrentTs() {
            const now = new Date();
            const ts = Math.floor(now.getTime() / 1000);
            document.getElementById('currentTs').textContent = ts;
            document.getElementById('currentDatetime').textContent = now.toLocaleString('zh-CN');
        }
        updateCurrentTs();
        setInterval(updateCurrentTs, 1000);

        // 常用时间戳
        function updateCommonTs() {
            const now = new Date();
            
            // 今天开始
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            document.getElementById('todayStart').textContent = Math.floor(todayStart.getTime() / 1000);
            
            // 今天结束
            const todayEnd = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 23, 59, 59);
            document.getElementById('todayEnd').textContent = Math.floor(todayEnd.getTime() / 1000);
            
            // 本周一
            const weekStart = new Date(now);
            weekStart.setDate(now.getDate() - now.getDay() + (now.getDay() === 0 ? -6 : 1));
            weekStart.setHours(0, 0, 0, 0);
            document.getElementById('weekStart').textContent = Math.floor(weekStart.getTime() / 1000);
            
            // 本月1日
            const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
            document.getElementById('monthStart').textContent = Math.floor(monthStart.getTime() / 1000);
        }
        updateCommonTs();

        // Toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 复制文本
        function copyText(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast('✅ 已复制');
            });
        }

        // 时间戳转日期
        function tsToDate() {
            const input = document.getElementById('tsInput').value.trim();
            if (!input) {
                showToast('请输入时间戳');
                return;
            }
            
            let ts = parseInt(input);
            if (input.length === 10) {
                ts = ts * 1000;
            }
            
            const date = new Date(ts);
            if (isNaN(date.getTime())) {
                showToast('无效的时间戳');
                return;
            }
            
            document.getElementById('tsResultValue').textContent = date.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
            document.getElementById('tsResult').classList.add('show');
        }

        // 粘贴当前时间戳
        function pasteNow() {
            document.getElementById('tsInput').value = Math.floor(Date.now() / 1000);
        }

        // 日期转时间戳
        function dateToTs() {
            const input = document.getElementById('dateInput').value;
            if (!input) {
                showToast('请选择日期时间');
                return;
            }
            
            const date = new Date(input);
            const seconds = Math.floor(date.getTime() / 1000);
            const millis = date.getTime();
            
            document.getElementById('tsSeconds').textContent = seconds;
            document.getElementById('tsMillis').textContent = millis;
            document.getElementById('dateResult').classList.add('show');
        }

        // 设为当前时间
        function setNowDate() {
            const now = new Date();
            const offset = now.getTimezoneOffset() * 60000;
            const local = new Date(now - offset);
            document.getElementById('dateInput').value = local.toISOString().slice(0, 16);
        }
        setNowDate();

        // 记录最近使用
        let recent = JSON.parse(localStorage.getItem('toolbox_recent') || '[]');
        recent = recent.filter(r => r.id !== 'timestamp');
        recent.unshift({ id: 'timestamp', name: '时间戳转换', icon: '⏱️', url: 'tools/timestamp.html' });
        if (recent.length > 10) recent.pop();
        localStorage.setItem('toolbox_recent', JSON.stringify(recent));
    </script>
</body>
</html>
