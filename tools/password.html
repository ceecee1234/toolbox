<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>密码生成器 - 随机安全密码在线生成 | 全能工具箱</title>
    <meta name="description" content="免费在线密码生成器，支持自定义长度和字符类型，一键生成高强度随机密码，保护账户安全。">
    <meta name="keywords" content="密码生成器,随机密码,安全密码,密码生成,强密码">
    <link rel="canonical" href="https://ceecee1234.github.io/toolbox/tools/password.html">
    <script>if(localStorage.getItem('theme')==='dark')document.documentElement.classList.add('dark');</script>
    <style>
        :root{--bg:#f8fafc;--card:#fff;--text:#1e293b;--text2:#64748b;--primary:#4F46E5;--primary-light:#EEF2FF;--success:#10B981;--warning:#F59E0B;--error:#EF4444;--border:#e2e8f0;--radius:12px}
        .dark{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--text2:#94a3b8;--border:#334155;--primary-light:rgba(79,70,229,0.2)}
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:-apple-system,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
        .header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--border);padding:12px 20px}
        .header-inner{max-width:800px;margin:0 auto;display:flex;justify-content:space-between;align-items:center}
        .logo{font-size:18px;font-weight:700;text-decoration:none;color:var(--text)}
        .main{max-width:800px;margin:0 auto;padding:20px}
        .breadcrumb{display:flex;gap:8px;font-size:14px;color:var(--text2);margin-bottom:20px}
        .breadcrumb a{color:var(--primary);text-decoration:none}
        .tool-header h1{font-size:26px;margin-bottom:20px;display:flex;align-items:center;gap:10px}
        .ad-slot{margin:20px 0;padding:15px;background:var(--card);border:1px dashed var(--border);border-radius:var(--radius);text-align:center;color:var(--text2)}
        .tool-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:20px}
        .password-display{background:var(--bg);border:2px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:20px;text-align:center;position:relative}
        .password-text{font-size:24px;font-weight:700;font-family:monospace;word-break:break-all;color:var(--primary)}
        .strength-bar{height:8px;background:var(--border);border-radius:4px;margin-top:16px;overflow:hidden}
        .strength-fill{height:100%;transition:all 0.3s}
        .strength-text{font-size:13px;margin-top:8px;text-align:center}
        .form-group{margin-bottom:20px}
        .form-group label{display:flex;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:8px}
        .form-group input[type="range"]{width:100%;height:8px;-webkit-appearance:none;background:var(--border);border-radius:4px;outline:none}
        .form-group input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;background:var(--primary);border-radius:50%;cursor:pointer}
        .checkbox-group{display:flex;flex-wrap:wrap;gap:16px}
        .checkbox-item{display:flex;align-items:center;gap:8px;cursor:pointer}
        .checkbox-item input{width:18px;height:18px;cursor:pointer}
        .btn-group{display:flex;gap:12px;flex-wrap:wrap}
        .btn{padding:14px 28px;border:none;border-radius:10px;font-size:16px;font-weight:600;cursor:pointer;transition:all 0.2s;flex:1;min-width:140px}
        .btn-primary{background:linear-gradient(135deg,var(--primary),#7C3AED);color:white}
        .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(79,70,229,0.3)}
        .btn-success{background:var(--success);color:white}
        .btn-secondary{background:var(--border);color:var(--text)}
        .history-section{margin-top:24px}
        .history-title{font-size:15px;font-weight:600;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
        .history-list{max-height:200px;overflow-y:auto}
        .history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg);border-radius:8px;margin-bottom:8px;font-family:monospace;font-size:14px}
        .history-item button{padding:6px 12px;font-size:12px;background:var(--primary);color:white;border:none;border-radius:6px;cursor:pointer}
        .footer{margin-top:60px;padding:30px;text-align:center;border-top:1px solid var(--border);color:var(--text2);font-size:14px}
        .footer a{color:var(--primary)}
        .toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(100px);padding:14px 28px;background:var(--success);color:white;border-radius:50px;opacity:0;transition:all 0.3s;z-index:1000}
        .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    </style>
</head>
<body>
    <header class="header">
        <div class="header-inner">
            <a href="../" class="logo">🛠️ 全能工具箱</a>
            <button onclick="document.documentElement.classList.toggle('dark');localStorage.setItem('theme',document.documentElement.classList.contains('dark')?'dark':'light')" style="background:none;border:none;font-size:20px;cursor:pointer">🌓</button>
        </div>
    </header>

    <main class="main">
        <nav class="breadcrumb">
            <a href="../">首页</a><span>›</span>
            <a href="../#text">文本工具</a><span>›</span>
            <span>密码生成器</span>
        </nav>

        <div class="ad-slot">📢 广告位</div>

        <div class="tool-header">
            <h1><span>🔐</span> 密码生成器</h1>
        </div>

        <div class="tool-card">
            <!-- 密码显示 -->
            <div class="password-display">
                <div class="password-text" id="passwordText">点击下方按钮生成密码</div>
                <div class="strength-bar">
                    <div class="strength-fill" id="strengthFill" style="width:0%;background:#ccc"></div>
                </div>
                <div class="strength-text" id="strengthText">--</div>
            </div>

            <!-- 密码长度 -->
            <div class="form-group">
                <label>
                    <span>密码长度</span>
                    <span id="lengthValue">16</span>位
                </label>
                <input type="range" id="lengthRange" min="6" max="64" value="16" oninput="updateLength()">
            </div>

            <!-- 字符类型 -->
            <div class="form-group">
                <label>包含字符类型</label>
                <div class="checkbox-group">
                    <label class="checkbox-item">
                        <input type="checkbox" id="uppercase" checked>
                        <span>大写字母 (A-Z)</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="lowercase" checked>
                        <span>小写字母 (a-z)</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="numbers" checked>
                        <span>数字 (0-9)</span>
                    </label>
                    <label class="checkbox-item">
                        <input type="checkbox" id="symbols" checked>
                        <span>特殊符号 (!@#$%)</span>
                    </label>
                </div>
            </div>

            <!-- 按钮组 -->
            <div class="btn-group">
                <button class="btn btn-primary" onclick="generatePassword()">🎲 生成密码</button>
                <button class="btn btn-success" onclick="copyPassword()">📋 复制</button>
                <button class="btn btn-secondary" onclick="clearHistory()">🗑️ 清空历史</button>
            </div>

            <!-- 历史记录 -->
            <div class="history-section">
                <div class="history-title">
                    <span>📜 历史记录</span>
                    <span style="font-size:12px;color:var(--text2)">最近10条</span>
                </div>
                <div class="history-list" id="historyList">
                    <div style="text-align:center;color:var(--text2);padding:20px">暂无历史记录</div>
                </div>
            </div>
        </div>

        <div class="ad-slot">📢 广告位</div>

        <!-- 使用说明 -->
        <div class="tool-card">
            <h3 style="margin-bottom:16px">💡 密码安全建议</h3>
            <ul style="padding-left:20px;color:var(--text2);font-size:14px;line-height:2">
                <li>密码长度建议 <strong>12位以上</strong>，越长越安全</li>
                <li>建议包含 <strong>大小写字母、数字、特殊符号</strong></li>
                <li>不同网站使用 <strong>不同密码</strong></li>
                <li>定期更换密码，建议 <strong>3-6个月</strong> 更换一次</li>
                <li>可使用密码管理器存储密码，如 1Password、Bitwarden</li>
            </ul>
        </div>
    </main>

    <footer class="footer">
        <p>© 2025 全能工具箱 | <a href="../">返回首页</a></p>
    </footer>

    <div id="toast" class="toast"></div>

    <script>
        let currentPassword = '';
        let history = JSON.parse(localStorage.getItem('pwd_history') || '[]');

        // 更新长度显示
        function updateLength() {
            document.getElementById('lengthValue').textContent = document.getElementById('lengthRange').value;
        }

        // 生成密码
        function generatePassword() {
            const length = parseInt(document.getElementById('lengthRange').value);
            const useUpper = document.getElementById('uppercase').checked;
            const useLower = document.getElementById('lowercase').checked;
            const useNumbers = document.getElementById('numbers').checked;
            const useSymbols = document.getElementById('symbols').checked;

            let chars = '';
            if (useUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (useLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (useNumbers) chars += '0123456789';
            if (useSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (!chars) {
                showToast('请至少选择一种字符类型');
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            currentPassword = password;
            document.getElementById('passwordText').textContent = password;
            
            // 计算强度
            updateStrength(password);
            
            // 添加到历史
            addToHistory(password);
            
            showToast('✅ 密码已生成');
        }

        // 更新强度指示
        function updateStrength(password) {
            let score = 0;
            if (password.length >= 8) score++;
            if (password.length >= 12) score++;
            if (password.length >= 16) score++;
            if (/[a-z]/.test(password)) score++;
            if (/[A-Z]/.test(password)) score++;
            if (/[0-9]/.test(password)) score++;
            if (/[^a-zA-Z0-9]/.test(password)) score++;

            const fill = document.getElementById('strengthFill');
            const text = document.getElementById('strengthText');

            if (score <= 2) {
                fill.style.width = '25%';
                fill.style.background = '#EF4444';
                text.textContent = '强度：弱 ⚠️';
                text.style.color = '#EF4444';
            } else if (score <= 4) {
                fill.style.width = '50%';
                fill.style.background = '#F59E0B';
                text.textContent = '强度：中等 💪';
                text.style.color = '#F59E0B';
            } else if (score <= 5) {
                fill.style.width = '75%';
                fill.style.background = '#10B981';
                text.textContent = '强度：强 🔒';
                text.style.color = '#10B981';
            } else {
                fill.style.width = '100%';
                fill.style.background = '#059669';
                text.textContent = '强度：非常强 🛡️';
                text.style.color = '#059669';
            }
        }

        // 复制密码
        function copyPassword() {
            if (!currentPassword) {
                showToast('请先生成密码');
                return;
            }
            navigator.clipboard.writeText(currentPassword).then(() => {
                showToast('✅ 已复制到剪贴板');
            });
        }

        // 添加到历史
        function addToHistory(password) {
            history.unshift({ password, time: new Date().toLocaleTimeString() });
            if (history.length > 10) history.pop();
            localStorage.setItem('pwd_history', JSON.stringify(history));
            renderHistory();
        }

        // 渲染历史
        function renderHistory() {
            const list = document.getElementById('historyList');
            if (history.length === 0) {
                list.innerHTML = '<div style="text-align:center;color:var(--text2);padding:20px">暂无历史记录</div>';
                return;
            }
            list.innerHTML = history.map(item => `
                <div class="history-item">
                    <span>${item.password}</span>
                    <button onclick="copyHistoryItem('${item.password}')">复制</button>
                </div>
            `).join('');
        }

        // 复制历史项
        function copyHistoryItem(password) {
            navigator.clipboard.writeText(password).then(() => {
                showToast('✅ 已复制');
            });
        }

        // 清空历史
        function clearHistory() {
            history = [];
            localStorage.removeItem('pwd_history');
            renderHistory();
            showToast('✅ 历史已清空');
        }

        // Toast
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // 初始化
        renderHistory();

        // 记录最近使用
        let recent = JSON.parse(localStorage.getItem('toolbox_recent') || '[]');
        recent = recent.filter(r => r.id !== 'password');
        recent.unshift({ id: 'password', name: '密码生成器', icon: '🔐', url: 'tools/password.html' });
        if (recent.length > 10) recent.pop();
        localStorage.setItem('toolbox_recent', JSON.stringify(recent));
    </script>
</body>
</html>
