<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON与XML万能双向互转器 - 全能工具箱 V2</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .aurora-bg {
            background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 50%, #ec4899 100%);
            background-size: 200% 200%;
            animation: aurora-animation 15s ease infinite;
        }
        @keyframes aurora-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800">

    <header class="aurora-bg text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-4">
                <a href="../index.html" class="bg-white/20 hover:bg-white/30 text-white p-2.5 rounded-xl transition-all duration-200 flex items-center justify-center backdrop-blur-md border border-white/10" title="返回主页">
                    <i class="fa-solid fa-arrow-left text-lg"></i>
                </a>
                <div>
                    <h1 class="text-2xl font-bold tracking-tight flex items-center gap-2">
                        JSON ↔ XML 万能互转
                    </h1>
                    <p class="text-white/80 text-sm mt-0.5">支持纯前端秒级双向格式转换，内置严格的实时语法纠错与排版美化面板</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button id="favBtn" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-2 backdrop-blur-md border border-white/10">
                    <i class="fa-regular fa-star" id="favIcon"></i>
                    <span id="favText">加入收藏</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 sm:px-6 lg:px-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <i class="fa-brands fa-js text-amber-500 text-base"></i> JSON 数据源
                    </label>
                    <div class="flex gap-3 text-xs">
                        <button onclick="formatJSON()" class="text-violet-600 hover:text-violet-800 font-semibold"><i class="fa-solid fa-wand-magic-sparkles mr-1"></i>美化排版</button>
                        <button onclick="clearArea('jsonInput')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-trash-can mr-1"></i>清空</button>
                    </div>
                </div>
                <textarea id="jsonInput" oninput="validateJSONRealtime()" class="w-full h-[450px] p-4 rounded-xl border border-slate-200 font-mono text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-violet-500/20 focus:border-violet-500 transition-all outline-none resize-none" placeholder='在此处输入或粘贴 JSON 字符串，例如：&#10;{&#10;  "site": "全能工具箱",&#10;  "status": "active"&#10;}'></textarea>
                
                <div id="jsonAlert" class="mt-2 text-xs text-rose-500 bg-rose-50 border border-rose-100 rounded-lg p-2.5 hidden font-mono">
                    <i class="fa-solid fa-triangle-exclamation mr-1"></i> <span id="jsonErrorMsg"></span>
                </div>

                <button onclick="jsonToXml()" class="w-full mt-4 py-3 aurora-bg text-white text-sm font-semibold rounded-xl shadow-md shadow-violet-500/10 hover:opacity-95 transition-all flex items-center justify-center gap-2">
                    <span>转换为 XML</span><i class="fa-solid fa-angles-right"></i>
                </button>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-6 flex flex-col">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-sm font-semibold text-slate-700 flex items-center gap-2">
                        <i class="fa-solid fa-code text-teal-500"></i> XML 数据源
                    </label>
                    <div class="flex gap-3 text-xs">
                        <button onclick="formatXML()" class="text-teal-600 hover:text-teal-800 font-semibold"><i class="fa-solid fa-align-left mr-1"></i>规范缩进</button>
                        <button onclick="clearArea('xmlInput')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-trash-can mr-1"></i>清空</button>
                    </div>
                </div>
                <textarea id="xmlInput" class="w-full h-[450px] p-4 rounded-xl border border-slate-200 font-mono text-xs bg-slate-50 focus:bg-white focus:ring-2 focus:ring-teal-500/20 focus:border-teal-500 transition-all outline-none resize-none" placeholder='在此处输入或粘贴 XML 文本，例如：&#10;&lt;root&gt;&#10;  &lt;site&gt;全能工具箱&lt;/site&gt;&#10;  &lt;status&gt;active&lt;/status&gt;&#10;&lt;/root&gt;'></textarea>
                
                <div id="xmlAlert" class="mt-2 text-xs text-amber-600 bg-amber-50 border border-amber-100 rounded-lg p-2.5 hidden font-mono">
                    <i class="fa-solid fa-circle-info mr-1"></i> 提示：逆向解析 XML 时，默认将采用 &lt;root&gt; 作为外层统一根节点。
                </div>

                <button onclick="xmlToJson()" class="w-full mt-4 py-3 bg-slate-800 text-white hover:bg-slate-900 text-sm font-semibold rounded-xl shadow-md transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-angles-left"></i><span>逆向转换为 JSON</span>
                </button>
            </div>

        </div>
    </main>

    <script>
        // 1. JSON 实时严格语法错误分析提示
        function validateJSONRealtime() {
            const raw = document.getElementById('jsonInput').value.trim();
            const alertBox = document.getElementById('jsonAlert');
            const msgSpan = document.getElementById('jsonErrorMsg');

            if(!raw) {
                alertBox.classList.add('hidden');
                return;
            }

            try {
                JSON.parse(raw);
                alertBox.classList.add('hidden'); // 校验成功，隐藏红灯
            } catch (err) {
                msgSpan.innerText = `语法错误: ${err.message}`;
                alertBox.classList.remove('hidden'); // 暴露缺陷位置
            }
        }

        // 2. JSON 一键格式化美化排版
        function formatJSON() {
            const val = document.getElementById('jsonInput').value.trim();
            if(!val) return;
            try {
                document.getElementById('jsonInput').value = JSON.stringify(JSON.parse(val), null, 2);
                document.getElementById('jsonAlert').classList.add('hidden');
            } catch (e) {
                alert('排版失败，请确保当前的 JSON 语法没有拼写缺陷！');
            }
        }

        // 3. 核心大招：JSON ➡️ XML
        function jsonToXml() {
            const jsonStr = document.getElementById('jsonInput').value.trim();
            if(!jsonStr) return alert('请输入需要处理的 JSON 字符串！');

            try {
                const jsonObj = JSON.parse(jsonStr);
                let xmlResult = '<?xml version="1.0" encoding="UTF-8"?>\n<root>\n';
                
                function objectToXml(obj, indent = '  ') {
                    let parts = '';
                    for (let key in obj) {
                        if (obj.hasOwnProperty(key)) {
                            let value = obj[key];
                            // 处理嵌套对象
                            if (typeof value === 'object' && value !== null && !Array.isArray(value)) {
                                parts += `${indent}<${key}>\n${objectToXml(value, indent + '  ')}${indent}</${key}>\n`;
                            } 
                            // 处理数组
                            else if (Array.isArray(value)) {
                                value.forEach(item => {
                                    if (typeof item === 'object' && item !== null) {
                                        parts += `${indent}<${key}>\n${objectToXml(item, indent + '  ')}${indent}</${key}>\n`;
                                    } else {
                                        parts += `${indent}<${key}>${escapeXmlEntities(item)}</${key}>\n`;
                                    }
                                });
                            } 
                            // 普通基础属性
                            else {
                                parts += `${indent}<${key}>${escapeXmlEntities(value)}</${key}>\n`;
                            }
                        }
                    }
                    return parts;
                }

                xmlResult += objectToXml(jsonObj);
                xmlResult += '</root>';
                document.getElementById('xmlInput').value = xmlResult;
                document.getElementById('xmlAlert').classList.add('hidden');
            } catch (err) {
                alert('核心转换中断：由于 JSON 侧存在拼写语法错误，无法完成向下解析生成！');
            }
        }

        // 4. 逆向神技：XML ➡️ JSON
        function xmlToJson() {
            const xmlStr = document.getElementById('xmlInput').value.trim();
            if(!xmlStr) return alert('请输入需要逆向提取的 XML 文本！');

            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlStr, "text/xml");
                
                // 检查是否有 XML 解析错误
                const parserError = xmlDoc.getElementsByTagName("parsererror");
                if (parserError.length > 0) {
                    return alert('XML 结构解析发生灾难性错误，请检查标签闭合状况！');
                }

                function domToJson(node) {
                    // 如果节点只是个纯文本
                    if (node.nodeType === 3) {
                        return node.nodeValue.trim();
                    }
                    
                    let obj = {};
                    if (node.hasChildNodes()) {
                        for (let i = 0; i < node.childNodes.length; i++) {
                            let item = node.childNodes.item(i);
                            let nodeName = item.nodeName;

                            // 过滤空白文本干扰项
                            if (item.nodeType === 3 && !item.nodeValue.trim()) continue;

                            if (item.nodeType === 3 || item.nodeType === 4) {
                                return item.nodeValue;
                            }

                            if (typeof obj[nodeName] === 'undefined') {
                                let val = domToJson(item);
                                if (val !== "") obj[nodeName] = val;
                            } else {
                                if (!Array.isArray(obj[nodeName])) {
                                    let old = obj[nodeName];
                                    obj[nodeName] = [];
                                    obj[nodeName].push(old);
                                }
                                obj[nodeName].push(domToJson(item));
                            }
                        }
                    }
                    
                    // 如果对象内部是空的，退化为纯文本或者空结构
                    if (Object.keys(obj).length === 0) {
                        return "";
                    }
                    return obj;
                }

                const resultObj = domToJson(xmlDoc.documentElement);
                document.getElementById('jsonInput').value = JSON.stringify(resultObj, null, 2);
                document.getElementById('jsonAlert').classList.add('hidden');
            } catch (e) {
                alert('逆向解析转换失败，请确保输入的 XML 拥有唯一的根标签，且内容闭合严密！');
            }
        }

        // 5. XML 纯前端轻量化排版美化
        function formatXML() {
            const xml = document.getElementById('xmlInput').value.trim();
            if(!xml) return;
            try {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xml, "text/xml");
                if(xmlDoc.getElementsByTagName("parsererror").length > 0) throw new Error();

                let formatted = '';
                let reg = /(>)(<)(\/*)/g;
                let pad = 0;
                
                let xmlString = new XMLSerializer().serializeToString(xmlDoc);
                xmlString = xmlString.replace(reg, '$1\r\n$2$3');
                
                xmlString.split('\r\n').forEach(function(node) {
                    let indent = 0;
                    if (node.match( /.+<\/\w[^>]*>$/ )) {
                        indent = 0;
                    } else if (node.match( /^<\/\w/ )) {
                        if (pad !== 0) pad -= 1;
                    } else if (node.match( /^<\w([^>]*[^\/])?>.*$/ )) {
                        indent = 1;
                    } else {
                        indent = 0;
                    }

                    let padding = '';
                    for (let i = 0; i < pad; i++) padding += '  ';
                    formatted += padding + node + '\r\n';
                    pad += indent;
                });

                document.getElementById('xmlInput').value = formatted.trim();
            } catch (e) {
                alert('XML 排版美化失败，请保证标签合规！');
            }
        }

        function escapeXmlEntities(string) {
            return String(string).replace(/[<>&"']/g, function (s) {
                return { '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;', "'": '&apos;' }[s];
            });
        }

        function clearArea(id) {
            document.getElementById(id).value = '';
            if(id === 'jsonInput') document.getElementById('jsonAlert').classList.add('hidden');
        }

        // 挂载收藏页联动
        document.addEventListener('DOMContentLoaded', () => {
            if (window.parent && window.parent.integrateToolPage) {
                window.parent.integrateToolPage('format-json-xml');
            }
        });
    </script>
</body>
</html>
